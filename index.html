<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>NK Maribor - sij okrog črk</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #1a0a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }

  .content {
    text-align: center;
  }

  .title, .year {
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
  }

  .title {
    font-size: 64px;
    letter-spacing: 4px;
    font-weight: 900;
  }

  .year {
    font-size: 20px;
    letter-spacing: 6px;
    font-weight: 700;
    margin-top: 10px;
  }

  .letter {
    position: relative;
    display: inline-block;
    color: #ffffff;
  }

  .letter.space {
    width: 0.5em;
  }

  .letter::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 65%;
    height: 65%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 224, 120, 0.95) 0%, rgba(255, 205, 60, 0.6) 40%, rgba(255, 205, 60, 0) 75%);
    filter: blur(3px);
    transform-origin: center;
    animation: orbit 2.6s linear infinite;
    z-index: 0;
    pointer-events: none;
  }

  .letter span { position: relative; z-index: 1; }

  @keyframes orbit {
    0%   { transform: translate(-50%, -50%) rotate(0deg) translateX(0.85em) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg) translateX(0.85em) rotate(-360deg); }
  }

  /* zamik animacije za vsako črko posebej, da nastane valujoč učinek */
  .title .letter:nth-child(1)::before  { animation-delay: 0.00s; }
  .title .letter:nth-child(2)::before  { animation-delay: 0.12s; }
  .title .letter:nth-child(3)::before  { animation-delay: 0.24s; }
  .title .letter:nth-child(4)::before  { animation-delay: 0.36s; }
  .title .letter:nth-child(5)::before  { animation-delay: 0.48s; }
  .title .letter:nth-child(6)::before  { animation-delay: 0.60s; }
  .title .letter:nth-child(7)::before  { animation-delay: 0.72s; }
  .title .letter:nth-child(8)::before  { animation-delay: 0.84s; }
  .title .letter:nth-child(9)::before  { animation-delay: 0.96s; }
  .title .letter:nth-child(10)::before { animation-delay: 1.08s; }

  .year .letter:nth-child(1)::before { animation-delay: 0.00s; }
  .year .letter:nth-child(2)::before { animation-delay: 0.12s; }
  .year .letter:nth-child(3)::before { animation-delay: 0.24s; }
  .year .letter:nth-child(4)::before { animation-delay: 0.36s; }
</style>
</head>
<body>
  <div class="content">
    <div class="title">
      <span class="letter"><span>N</span></span>
      <span class="letter"><span>K</span></span>
      <span class="letter space"></span>
      <span class="letter"><span>M</span></span>
      <span class="letter"><span>A</span></span>
      <span class="letter"><span>R</span></span>
      <span class="letter"><span>I</span></span>
      <span class="letter"><span>B</span></span>
      <span class="letter"><span>O</span></span>
      <span class="letter"><span>R</span></span>
    </div>
    <div class="year">
      <span class="letter"><span>1</span></span>
      <span class="letter"><span>9</span></span>
      <span class="letter"><span>6</span></span>
      <span class="letter"><span>0</span></span>
    </div>
  </div>
</body>
</html>

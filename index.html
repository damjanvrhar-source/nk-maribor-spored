<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>NK Maribor - sij okrog črk</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #1a0a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
  }

  .content { text-align: center; }

  .title, .year {
    display: flex;
    justify-content: center;
  }

  .title {
    font-size: 64px;
    letter-spacing: 4px;
    font-weight: 900;
  }

  .year {
    font-size: 20px;
    letter-spacing: 6px;
    font-weight: 700;
    margin-top: 10px;
  }

  .letter {
    display: inline-block;
    color: #ffffff;
    animation: glowRing 2.4s linear infinite;
  }

  .letter.space { width: 0.5em; }

  @keyframes glowRing {
    0%   { text-shadow:  0 -6px 10px #ffd65a,  0 -2px 4px #ffe89a; }
    25%  { text-shadow:  6px 0 10px #ffd65a,  2px 0 4px #ffe89a; }
    50%  { text-shadow:  0 6px 10px #ffd65a,  0 2px 4px #ffe89a; }
    75%  { text-shadow: -6px 0 10px #ffd65a, -2px 0 4px #ffe89a; }
    100% { text-shadow:  0 -6px 10px #ffd65a,  0 -2px 4px #ffe89a; }
  }

  .title .letter:nth-child(1)  { animation-delay: 0.00s; }
  .title .letter:nth-child(2)  { animation-delay: 0.10s; }
  .title .letter:nth-child(3)  { animation-delay: 0.20s; }
  .title .letter:nth-child(4)  { animation-delay: 0.30s; }
  .title .letter:nth-child(5)  { animation-delay: 0.40s; }
  .title .letter:nth-child(6)  { animation-delay: 0.50s; }
  .title .letter:nth-child(7)  { animation-delay: 0.60s; }
  .title .letter:nth-child(8)  { animation-delay: 0.70s; }
  .title .letter:nth-child(9)  { animation-delay: 0.80s; }
  .title .letter:nth-child(10) { animation-delay: 0.90s; }

  .year .letter:nth-child(1) { animation-delay: 0.00s; }
  .year .letter:nth-child(2) { animation-delay: 0.10s; }
  .year .letter:nth-child(3) { animation-delay: 0.20s; }
  .year .letter:nth-child(4) { animation-delay: 0.30s; }
</style>
</head>
<body>
  <div class="content">
    <div class="title">
      <span class="letter">N</span><span class="letter">K</span><span class="letter space"></span><span class="letter">M</span><span class="letter">A</span><span class="letter">R</span><span class="letter">I</span><span class="letter">B</span><span class="letter">O</span><span class="letter">R</span>
    </div>
    <div class="year">
      <span class="letter">1</span><span class="letter">9</span><span class="letter">6</span><span class="letter">0</span>
    </div>
  </div>
</body>
</html>

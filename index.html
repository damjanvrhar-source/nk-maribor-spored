  body{

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

      radial-gradient(circle at 15% 0%, #7b2fb522 0%, transparent 45%),

  body::before, body::after{
    content:"";
    position:fixed;
    width:520px;height:520px;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.16;
    z-index:-1;
    pointer-events:none;
  }
  .grb-vodni-znak{
    content:"";
    position:fixed;
    top:50%;
    left:50%;
    width:min(90vw, 900px);
    height:min(90vw, 900px);
    transform:translate(-50%, -50%);
    background:url('grb.png') center/contain no-repeat;
    opacity:0.09;
    z-index:-1;
    pointer-events:none;
  }
  body::before{
    top:-180px; left:-160px;
    background:radial-gradient(circle, var(--vijola-2), transparent 70%);
    animation:blobFloat1 16s ease-in-out infinite;
  }
  body::after{
    bottom:-200px; right:-160px;
    background:radial-gradient(circle, var(--zlata), transparent 70%);
    animation:blobFloat2 20s ease-in-out infinite;
  }
  @keyframes blobFloat1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(40px,60px) scale(1.15); }
  }
  @keyframes blobFloat2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-50px,-40px) scale(1.2); }
  }
  #introScreen{

    0%,100%{ opacity:1; text-shadow:0 0 0 rgba(245,197,24,0); }
    50%{ opacity:0.75; text-shadow:0 0 8px rgba(245,197,24,0.55); }
  }
  .tekma{
    flex:1;
    font-size:15px;
    font-weight:800;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    min-width:0;
  }
  .tekma-glavno{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:6px;
    width:100%;
  }
  .tekma-stran{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
  }
  .tekma-doma{ justify-content:flex-end; }
  .tekma-gost{ justify-content:flex-start; }
  .tekma-grb{
    width:20px;
    height:20px;
    object-fit:contain;
    flex-shrink:0;
  }
  .tekma-crta{
    color:var(--muted-light);
    font-weight:700;
  }
  .rezultat{
    display:inline-block;
    background:var(--vijola);
    color:#fff;
    font-weight:900;
    font-size:13.5px;
    padding:2px 6px;
    width:44px;
    text-align:center;
    border-radius:8px;
    margin:0 4px;
    cursor:pointer;
    transition:transform .15s ease;
    animation:pillPop .3s ease backwards, rezultatGlow 2.4s ease-in-out .3s infinite;
  }
  .rezultat:hover{ transform:scale(1.1); }
  .rezultat:active{ transform:scale(0.95); }
  @keyframes rezultatGlow{
    0%,100%{ box-shadow:0 0 0 rgba(245,197,24,0); }
    50%{ box-shadow:0 0 10px rgba(245,197,24,0.65); }
  }
  .match.played{
    border-left-color:var(--vijola-2);
  }
  .match.played .badge{
    opacity:0.65;
  }
  .match.played .krog,
  .match.played .datum,
  .match.played .venue,
  .match.played .tekma-glavno .tim,
  .match.played .tekma-glavno .maribor{
    opacity:0.6;
  }
  .tekma .maribor{color:var(--vijola-2);position:relative;display:inline-block;}
  .tekma .tim{white-space:nowrap;}
  .tekma .maribor::after{
    content:"";
    position:absolute;left:0;right:0;bottom:-2px;height:3px;
    border-radius:2px;
    background:linear-gradient(90deg, var(--zlata) 0%, #fff2b8 50%, var(--zlata) 100%);
    background-size:220% auto;
    animation:mariborUnderline 3s linear infinite;
  }
  @keyframes mariborUnderline{
    0%{ background-position:0% 0; }
    100%{ background-position:-220% 0; }
  }
  .venue{
    font-size:12px;
    color:var(--muted);
    text-align:right;
    width:170px;
    flex-shrink:0;
  }
  .match.home .venue{
    color:var(--vijola-2);
    font-weight:800;
  }
  .badge{
    display:inline-block;
    font-size:10px;
    font-weight:800;
    padding:3px 9px;
    border-radius:20px;
    margin-left:8px;
    vertical-align:middle;
    letter-spacing:0.3px;
    box-shadow:0 2px 5px rgba(0,0,0,0.12);
  }
  .badge.h{background:var(--zlata);color:#4a3800;position:relative;}
  .badge.h::after{
    content:"";
    position:absolute; inset:-8px -12px;
    background-image:
      radial-gradient(circle, var(--zlata) 2px, transparent 2.5px),
      radial-gradient(circle, var(--vijola-2) 2px, transparent 2.5px),
      radial-gradient(circle, var(--derby) 1.6px, transparent 2px),
      radial-gradient(circle, var(--vijola) 1.6px, transparent 2px);
    background-position:0 20%, 100% 10%, 25% 100%, 75% 90%;
    background-repeat:no-repeat;
    opacity:0;
    pointer-events:none;
  }
  .match.home:hover .badge.h::after{
    animation:confettiBurst .65s ease-out;
  }
  @keyframes confettiBurst{
    0%{ opacity:1; transform:scale(0.3) translateY(0) rotate(0deg); }
    100%{ opacity:0; transform:scale(1.4) translateY(-16px) rotate(35deg); }
  }
  .badge.a{background:var(--lila-100);color:var(--vijola);}
  .badge.derby{background:var(--derby);color:#fff;animation:derbyPulse 1.6s ease-in-out infinite;}
  @keyframes derbyPulse{
    0%,100%{ box-shadow:0 0 0 rgba(232,51,46,0.5); }
    50%{ box-shadow:0 0 10px rgba(232,51,46,0.75); }
  }

  footer{
    margin-top:34px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
    line-height:1.7;
    padding-bottom:10px;
  }
  footer .foot-crest{
    opacity:0.6;
    margin-bottom:8px;
    display:inline-block;
    animation:footCrestFloat 3s ease-in-out infinite;
  }
  @keyframes footCrestFloat{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-4px) rotate(6deg); }
  }

  /* ===== COUNTDOWN ===== */
  /* ===== TOP ROW: odštevalnik (levo) + lestvica (desno) ===== */
  .top-row{
    display:flex;
    gap:18px;
    align-items:stretch;
    margin-bottom:22px;
  }
  .top-row .countdown{
    flex:0 0 auto;
    width:auto;
    aspect-ratio:9/16;
    align-self:flex-start;
    min-width:0;
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    animation:slideInLeft .6s .15s cubic-bezier(.21,.86,.4,1) both, countdownGlow 3s ease-in-out .75s infinite;
  }
  .top-row .table-wrap{
    flex:1;
    min-width:0;
    height:auto;
    align-self:flex-start;
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    animation:slideInRight .6s .25s cubic-bezier(.21,.86,.4,1) both;
  }
  .top-row .lestvica-scroll-wrap{
    overflow-y:visible;
    flex:none;
    min-height:0;
    scrollbar-width:thin;
    scrollbar-color:var(--zlata) transparent;
  }
  .top-row .lestvica-scroll-wrap::-webkit-scrollbar{
    width:8px;
  }
  .top-row .lestvica-scroll-wrap::-webkit-scrollbar-track{
    background:transparent;
  }
  .top-row .lestvica-scroll-wrap::-webkit-scrollbar-thumb{
    background:linear-gradient(var(--zlata), var(--vijola-2));
    border-radius:8px;
  }
  .top-row .lestvica-scroll-wrap::-webkit-scrollbar-thumb:hover{
    background:var(--zlata);
  }
  @keyframes slideInLeft{
    0%{ opacity:0; transform:translateX(-24px); }
    100%{ opacity:1; transform:translateX(0); }
  }
  @keyframes slideInRight{
    0%{ opacity:0; transform:translateX(24px); }
    100%{ opacity:1; transform:translateX(0); }
  }
  .top-row .table-wrap > div:last-child{
    flex:none;
  }
  @media(max-width:800px){
    .top-row{flex-direction:column; align-items:center;}
    .top-row .countdown{flex:none; width:min(260px, 70vw);}
    .top-row .table-wrap{width:100%;}
  }

  .countdown{
    background:linear-gradient(150deg, var(--vijola-dark) 0%, var(--vijola) 100%);
    border:2px solid var(--zlata);
    border-radius:18px;
    padding:20px 24px;
    margin-bottom:26px;
    color:#fff;
    text-align:center;
    box-shadow:0 10px 26px rgba(46,15,77,0.3);
    position:relative;
    overflow:hidden;
  }
  .countdown-bg-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 35%;
    transform:scale(1);
    z-index:0;
  }
  .countdown::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(46,15,77,0.55) 0%, rgba(46,15,77,0.3) 35%, rgba(46,15,77,0.35) 65%, rgba(46,15,77,0.65) 100%);
    z-index:1;
    pointer-events:none;
  }
  .countdown > *:not(.countdown-bg-img){
    position:relative;
    z-index:2;
  }
  @keyframes countdownGlow{
    0%,100%{ box-shadow:0 10px 26px rgba(46,15,77,0.3), 0 0 0 rgba(245,197,24,0); }
    50%{ box-shadow:0 10px 30px rgba(46,15,77,0.35), 0 0 24px rgba(245,197,24,0.35); }
  }
  .matchday-badge{
    display:none;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:var(--zlata);
    color:var(--vijola-dark);
    font-weight:900;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:6px 14px;
    border-radius:20px;
    margin:0 auto 14px;
    width:fit-content;
    animation:matchdayPulse 1.6s ease-in-out infinite;
  }
  .matchday-badge.visible{ display:inline-flex; }

  @keyframes matchdayPulse{
    0%,100%{ transform:scale(1); box-shadow:0 0 0 rgba(245,197,24,0.6); }
    50%{ transform:scale(1.05); box-shadow:0 0 14px rgba(245,197,24,0.85); }
  }
  .countdown.matchday{
    animation:countdownGlow 1.6s ease-in-out infinite, matchdayBorderPulse 1.6s ease-in-out infinite;
  }
  @keyframes matchdayBorderPulse{
    0%,100%{ border-color:var(--zlata); }
    50%{ border-color:#fff; }
  }
  .countdown .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--zlata);
    font-weight:800;
    margin-bottom:8px;
  }
  .countdown .next-match{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:16px;
  }
  .match-title-grbi{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
  }
  .match-title-grb{
    width:56px;
    height:56px;
    object-fit:contain;
    flex-shrink:0;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,0.7));
    transition:transform .2s ease;
    opacity:0;
    animation:grbPop .65s cubic-bezier(.34,1.56,.64,1) both, grbLebdi 3.2s ease-in-out 1s infinite;
  }
  .match-title-grb:nth-of-type(1){ animation-delay:.05s, 1s; }
  .match-title-grb:nth-of-type(2){ animation-delay:.3s, 1.5s; }
  .match-title-grb:hover{
    transform:scale(1.12) !important;
  }
  @keyframes grbPop{
    0%{ opacity:0; transform:scale(0.3) rotate(-18deg); }
    55%{ opacity:1; transform:scale(1.18) rotate(6deg); }
    80%{ transform:scale(0.95) rotate(-2deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes grbLebdi{
    0%,100%{ transform:translateY(0); filter:drop-shadow(0 3px 8px rgba(0,0,0,0.7)); }
    50%{ transform:translateY(-5px); filter:drop-shadow(0 3px 8px rgba(0,0,0,0.7)) drop-shadow(0 0 12px rgba(245,197,24,0.65)); }
  }
  .match-title-vs{
    font-family:var(--font-naslov);
    font-size:20px;
    color:var(--zlata);
    text-shadow:0 2px 8px rgba(0,0,0,0.8);
    flex-shrink:0;
    opacity:0;
    animation:nextMatchPop .5s cubic-bezier(.34,1.56,.64,1) .2s both, vsUtrip 2.4s ease-in-out 1s infinite;
  }
  @keyframes vsUtrip{
    0%,100%{ text-shadow:0 2px 8px rgba(0,0,0,0.8); }
    50%{ text-shadow:0 2px 8px rgba(0,0,0,0.8), 0 0 12px rgba(245,197,24,0.9); }
  }
  .countdown .kickoff-line{
    margin-top:8px;
    font-size:17px;
    padding:0 6px;
    animation:nextMatchPop .6s cubic-bezier(.34,1.56,.64,1) .15s both, venueBreathe 4s ease-in-out 1s infinite;
  }
  @keyframes nextMatchPop{
    0%{ opacity:0; transform:scale(0.85) translateY(8px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  @keyframes textFlicker{
    0%,100%{ text-shadow:0 2px 10px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.5); }
    50%{ text-shadow:0 2px 10px rgba(0,0,0,0.85), 0 0 14px rgba(245,197,24,0.4); }
  }
  .countdown .next-match .maribor{color:var(--zlata);}
  .countdown .venue-mini{
    font-size:14px;
    font-weight:700;
    display:block;
    margin-top:6px;
    text-shadow:0 2px 10px rgba(0,0,0,0.95);
    opacity:0;
    animation:nextMatchPop .6s cubic-bezier(.34,1.56,.64,1) .3s forwards, venueBreathe 4s ease-in-out 1s infinite;
  }
  @keyframes venueBreathe{
    0%,100%{ opacity:1; text-shadow:0 2px 8px rgba(0,0,0,0.85); }
    50%{ opacity:0.4; text-shadow:0 2px 8px rgba(0,0,0,0.85), 0 0 16px rgba(245,197,24,0.9), 0 0 30px rgba(245,197,24,0.45); }
  }
  .countdown .kickoff-time{
    opacity:1;
    font-weight:700;
  }
  .countdown .kickoff-time.confirmed{ color:var(--zlata); }
  .countdown .kickoff-time.tentative{ color:#e7d7fa; font-weight:400; font-style:italic; }
  .timer{
    display:flex;
    justify-content:center;
    gap:5px;
    flex-wrap:nowrap;
    margin-top:10px;
  }
  .timer .unit{
    background:rgba(20,8,35,0.55);
    border:1px solid rgba(245,197,24,0.5);
    border-radius:10px;
    padding:10px 4px;
    min-width:0;
    flex:1;
    transition:transform .2s ease, background-color .2s ease;
  }
  .timer .unit:hover{
    transform:translateY(-3px) scale(1.05);
    background:rgba(245,197,24,0.18);
  }
  .timer .num{
    font-size:23px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    color:var(--zlata);
    line-height:1;
    text-shadow:0 2px 10px rgba(0,0,0,0.95);
    animation:numGlow 2.4s ease-in-out infinite, venueBreathe 4s ease-in-out 1s infinite;
  }
  @keyframes numGlow{
    0%,100%{ text-shadow:0 2px 10px rgba(0,0,0,0.95); }
    50%{ text-shadow:0 2px 10px rgba(0,0,0,0.95), 0 0 14px rgba(245,197,24,0.7); }
  }
  @keyframes numPop{
    0%{ transform:scale(1.35); opacity:0.5; }
    100%{ transform:scale(1); opacity:1; }
  }
  .timer .num.pop{
    animation:numPop 0.35s ease-out;
  }
  .timer .unit-label{
    font-size:8px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    text-shadow:0 1px 4px rgba(0,0,0,0.8);
    margin-top:2px;
    animation:venueBreathe 4s ease-in-out 1s infinite;
  }
  .countdown .note{
    font-size:11px;
    opacity:0.6;
    margin-top:14px;
  }

  /* ===== LESTVICA ===== */
  .table-wrap{
    background:var(--card);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 14px 34px rgba(46,15,77,0.32), 0 4px 10px rgba(46,15,77,0.18);
    margin-bottom:22px;
    border:none;
  }
  .lestvica-brez-naslova{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    padding:2px;
    background:linear-gradient(135deg, var(--zlata) 0%, var(--vijola-2) 45%, var(--vijola-dark) 75%, var(--zlata) 100%);
  }
  .lestvica-brez-naslova::before{
    content:"";
    position:absolute;
    inset:-50%;
    background:conic-gradient(from 0deg, transparent 0deg, transparent 320deg, var(--zlata) 350deg, #fff8dd 358deg, var(--zlata) 360deg);
    animation:krogecSvetloba 7s linear infinite;
    opacity:0.85;
  }
  @keyframes krogecSvetloba{
    to{ transform:rotate(360deg); }
  }
  .lestvica-glow-inner{
    position:relative;
    z-index:1;
    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .table-header{
    background:linear-gradient(90deg,var(--vijola),var(--vijola-2),var(--vijola));
    background-size:200% 100%;
    animation:tableHeaderSheen 6s ease-in-out infinite;
    color:#fff;
    padding:12px 16px;
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  @keyframes tableHeaderSheen{
    0%,100%{ background-position:0% 0; }
    50%{ background-position:100% 0; }
  }
  .table-header .updated{
    font-size:10.5px;
    font-weight:400;
    text-transform:none;
    letter-spacing:0;
    opacity:0.8;
  }
  table.lestvica{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  table.lestvica th{
    text-align:center;
    padding:8px 4px;
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.6px;
    font-weight:700;
    border-bottom:2px solid var(--lila-200);
  }
  table.lestvica th.name-col, table.lestvica td.name-col{
    text-align:left;
    padding-left:14px;
  }
  table.lestvica td.name-col{
    color:#000;
    font-weight:700;
    white-space:nowrap;
  }
  .lestvica-grb{
    width:20px;
    height:20px;
    object-fit:contain;
    vertical-align:middle;
    margin-right:7px;
  }
  table.lestvica td{
    text-align:center;
    padding:8px 4px;
    border-bottom:1px solid var(--lila-200);
  }
  table.lestvica tr:last-child td{border-bottom:none;}
  table.lestvica tbody tr{
    opacity:0;
    animation:rowFadeIn .35s ease forwards;
    transition:background-color .15s ease;
  }
  table.lestvica tbody tr:hover{ background:var(--lila-100); }
  table.lestvica tbody tr:nth-child(even){ background:var(--lila-100); }
  @keyframes rowFadeIn{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  table.lestvica tbody tr:nth-child(1){animation-delay:.02s;}
  table.lestvica tbody tr:nth-child(2){animation-delay:.05s;}
  table.lestvica tbody tr:nth-child(3){animation-delay:.08s;}
  table.lestvica tbody tr:nth-child(4){animation-delay:.11s;}
  table.lestvica tbody tr:nth-child(5){animation-delay:.14s;}
  table.lestvica tbody tr:nth-child(6){animation-delay:.17s;}
  table.lestvica tbody tr:nth-child(7){animation-delay:.20s;}
  table.lestvica tbody tr:nth-child(8){animation-delay:.23s;}
  table.lestvica tbody tr:nth-child(9){animation-delay:.26s;}
  table.lestvica tbody tr:nth-child(10){animation-delay:.29s;}

  table.lestvica td.pos{
    width:28px;
    padding:10px 2px;
    display:flex;
    align-items:center;
    gap:5px;
    justify-content:center;
  }
  .pos-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px;height:20px;
    border-radius:50%;
    font-weight:700;
    font-size:11px;
    color:var(--vijola-dark);
    background:var(--lila-100);
  }
  .gib{
    display:inline-block;
    width:0; height:0;
    flex-shrink:0;
  }
  .gib-enako{
    width:9px; height:9px;
    border-radius:50%;
    background:#f5c518;
    animation:gibPulse 1.6s ease-in-out infinite;
  }
  @keyframes gibPulse{
    0%,100%{ box-shadow:0 0 0 rgba(245,197,24,0.6); transform:scale(1); }
    50%{ box-shadow:0 0 6px rgba(245,197,24,0.9); transform:scale(1.15); }
  }
  .gib-gor{
    border-left:5px solid transparent;
    border-right:5px solid transparent;
    border-bottom:8px solid #2e9e5b;
    animation:gibBounceGor 1.2s ease-in-out infinite;
  }
  @keyframes gibBounceGor{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-3px); }
  }
  .gib-dol{
    border-left:5px solid transparent;
    border-right:5px solid transparent;
    border-top:8px solid #e8332e;
    animation:gibBounceDol 1.2s ease-in-out infinite;
  }
  @keyframes gibBounceDol{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(3px); }
  }
  tr.zone-cl td:first-child{ box-shadow:inset 6px 0 0 var(--liga-prvakov); }
  tr.zone-conf td:first-child{ box-shadow:inset 6px 0 0 var(--konferencna); }
  tr.zone-warn td:first-child{ box-shadow:inset 6px 0 0 var(--kvalifikacije); }
  tr.zone-out td:first-child{ box-shadow:inset 6px 0 0 var(--derby); }

  table.lestvica td.points{ padding:6px 4px; }
  .points-pill{
    display:inline-block;
    min-width:26px;
    padding:3px 8px;
    border-radius:20px;
    font-weight:900;
    font-size:12.5px;
    color:#fff;
    background:linear-gradient(150deg,var(--vijola-2),var(--vijola));
    animation:pillPop .3s ease backwards;
  }
  @keyframes pillPop{
    from{ transform:scale(0.5); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  table.lestvica tbody tr.maribor-row{
    font-weight:700;
  }
  tr.maribor-row:not(.zone-cl):not(.zone-conf):not(.zone-warn):not(.zone-out) td:first-child{

    const osc = ctx.createOscillator();

function izracunajStrelceMaribora(){
  const goli = {}; // ime -> število golov
  fixtures.forEach(f => {
    const krog = f[0], dom = f[2], gost = f[3];
    const podatki = STRELCI[krog];
    if(!podatki) return;
    const mariborStran = dom === "Maribor" ? podatki.dom : (gost === "Maribor" ? podatki.gost : null);
    if(!mariborStran) return;
    mariborStran.forEach(vnos => {
      const ime = vnos.replace(/\s*\d.*$/, '').trim();
      const steviloGolov = (vnos.match(/\d+'/g) || []).length || 1;
      goli[ime] = (goli[ime] || 0) + steviloGolov;
    });
  });
  return Object.entries(goli).sort((a,b) => b[1]-a[1]);
}

function izracunajTopStrelce(){
  // isto štetje kot izracunajStrelceMaribora, a brez avtogolov nasprotnikov (l.g.)
  const goli = {};
  let avtogoli = 0;
  fixtures.forEach(f => {
    const podatki = STRELCI[f[0]];
    if(!podatki) return;
    const stran = f[2] === "Maribor" ? podatki.dom : (f[3] === "Maribor" ? podatki.gost : null);
    if(!stran) return;
    stran.forEach(vnos => {
      const n = (vnos.match(/\d+'/g) || []).length || 1;
      if(/\(l\.g\.\)/i.test(vnos)){ avtogoli += n; return; }
      const ime = vnos.replace(/\s*\d.*$/, '').trim();
      goli[ime] = (goli[ime] || 0) + n;
    });
  });
  const seznam = Object.entries(goli).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0], 'sl'));
  return { seznam, avtogoli };
}

function izrisiTopStrelce(){
  const { seznam, avtogoli } = izracunajTopStrelce();
  if(seznam.length === 0) return '';
  const top = seznam.slice(0, 5);
  const max = top[0][1];
  const vrstice = top.map(([ime, st], i) => {
    const deli = ime.split(' ');
    const priimek = deli.pop();
    const imeHtml = deli.length ? `${deli.join(' ')} <span class="kader-priimek">${priimek}</span>` : `<span class="kader-priimek">${priimek}</span>`;
    return `<div class="top-strelec">
      <span class="top-strelec-mesto">${top.findIndex(t => t[1] === st) + 1}</span>
      <span>${imeHtml}</span>
      <span class="top-strelec-trak"><span class="top-strelec-polnilo" style="width:${Math.round(st / max * 100)}%"></span></span>
      <span class="top-strelec-goli">${st}</span>
    </div>`;
  }).join('');
  const opomba = avtogoli > 0 ? `<div class="top-strelci-opomba">Poleg tega ${avtogoli} ${avtogoli === 1 ? 'avtogol' : 'avtogoli'} nasprotnikov.</div>` : '';
  return `<div class="lestvica-kader-skupina">
    <div class="lestvica-kader-naslov">Najboljši strelci</div>
    <div class="lestvica-kader-seznam">${vrstice}</div>
    ${opomba}
  </div>`;
}

function izrisiStrelceZaLestvico(){
  const golovList = izracunajStrelceMaribora();
  const golovMap = Object.fromEntries(golovList);
  const MEJA_ZOGIC = 5;

  const razdeliIme = (polnoIme) => {
    const deli = polnoIme.trim().split(' ');
    const priimek = deli.pop();
    const ime = deli.join(' ');
    return ime ? `${ime} <span class="kader-priimek">${priimek}</span>` : `<span class="kader-priimek">${priimek}</span>`;
  };

  const skupine = Object.entries(KADER).map(([pozicija, igralci]) => {
    const vrstice = igralci.map(ig => {
      const st = golovMap[ig.ime] || 0;
      let zogice = '';
      if(st > 0 && st <= MEJA_ZOGIC){
        zogice = '<span class="gol-zoga"></span>'.repeat(st);
      } else if(st > MEJA_ZOGIC){
        zogice = `<span class="gol-zoga-stevilo">×${st}</span>`;
      }
      return `<div class="kader-igralec-mini"><span class="kader-st-mini">${ig.st}</span> ${razdeliIme(ig.ime)} ${ig.drz ? `<span class="kader-zastava">${ig.drz.toUpperCase()}</span>` : ''} ${zogice}</div>`;
    }).join('');
    return `
      <div class="lestvica-kader-skupina">
        <div class="lestvica-kader-naslov">${pozicija}</div>
        <div class="lestvica-kader-seznam">${vrstice}</div>
      </div>
    `;
  }).join('');

  return skupine;
}

const dnevi = ["nedelja","ponedeljek","torek","sreda","četrtek","petek","sobota"];
const meseci = ["jan","feb","mar","apr","maj","jun","jul","avg","sep","okt","nov","dec"];

function formatDate(iso){
  const d = new Date(iso+"T12:00:00");
  const dan = dnevi[d.getDay()];
  const dd = d.getDate();
  const mes = meseci[d.getMonth()];
  return {dan, label: `${dd}. ${mes} ${d.getFullYear()}`};
}

function izrisiKoledarV(idNaslov, idDnevi, idMreza){
  const { leto, mesec } = koledarLetoMesec;
  const naslovEl = document.getElementById(idNaslov);
  const dneviEl = document.getElementById(idDnevi);
  const mrezaEl = document.getElementById(idMreza);
  if(!naslovEl || !mrezaEl) return;

  naslovEl.textContent = `${meseci[mesec]} ${leto}`;
  dneviEl.innerHTML = ['Pon','Tor','Sre','Čet','Pet','Sob','Ned'].map(d => `<span>${d}</span>`).join('');

  const prviDan = new Date(leto, mesec, 1);
  let zamik = prviDan.getDay() - 1;
  if(zamik < 0) zamik = 6;
  const steviloDni = new Date(leto, mesec + 1, 0).getDate();
  const danes = new Date();
  const danesISO = danes.toISOString().slice(0,10);

  let html = '';
  for(let i = 0; i < zamik; i++){
    html += '<div class="koledar-dan prazen"></div>';
  }
  for(let dan = 1; dan <= steviloDni; dan++){
    const mm = String(mesec + 1).padStart(2,'0');
    const dd = String(dan).padStart(2,'0');
    const iso = `${leto}-${mm}-${dd}`;
    const tekma = koledarTekmePoDatumu[iso];
    const jeDanes = iso === danesISO;
    let razred = 'koledar-dan';
    if(jeDanes) razred += ' danes';
    if(tekma){
      razred += ' ima-tekmo';
      if(REZULTATI[tekma.krog]) razred += ' odigrana';

    const nasprotnik = tekma ? (tekma.dom === "Maribor" ? tekma.gost : tekma.dom) : null;

      ? `<img class="koledar-grb" src="${GRBI_KLUBOV[nasprotnik] || 'grb.png'}" alt="${nasprotnik || ''}">`
      : `${dan}`;
    html += `<div class="${razred}" ${tekma ? `data-krog="${tekma.krog}" title="${dan}. ${meseci[mesec]} — ${tekma.dom} — ${tekma.gost}"` : ''}>${vsebina}</div>`;
  }
  mrezaEl.innerHTML = html;

  mrezaEl.querySelectorAll('.ima-tekmo').forEach(el => {

const fadeObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if(entry.isIntersecting){
      const i = Array.from(document.querySelectorAll('.match, .polsezon')).indexOf(entry.target);
      const zamik = Math.min(i, 8) * 45;
      setTimeout(() => entry.target.classList.add('visible'), zamik);
      fadeObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.1, rootMargin: "0px 0px -40px 0px" });

/* Ker uradne ure tekem še niso objavljene, uporabljamo oceno 18:00 (lokalni čas, Europe/Ljubljana). */
const ASSUMED_KICKOFF = "18:00:00";

function getNextFixture(){
  const now = new Date();
  for(const f of fixtures){
    const [krog, datum, dom, gost] = f;
    const uraTekme = POTRJENE_URE[krog] ? POTRJENE_URE[krog] + ":00" : ASSUMED_KICKOFF;
    const kickoff = new Date(`${datum}T${uraTekme}`);
    if(kickoff.getTime() > now.getTime()){
      return {
        krog, datum, dom, gost, kickoff, prizorisce: f[4], derby: f[5] === "derby",
        ura: POTRJENE_URE[krog] || null,
        uraPotrjena: !!POTRJENE_URE[krog]
      };
    }
  }
  return null;
}

function pad(n){ return String(n).padStart(2,"0"); }

/* Današnji datum v slovenskem časovnem pasu (neodvisno od pasu naprave) */
function danasnjiDatumLjubljana(){
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Ljubljana' }).format(new Date());
}

function nastaviMatchdayOznako(prikazi){
  const badge = document.getElementById('matchdayBadge');
  const box = document.getElementById('countdownBox');
  if(badge) badge.classList.toggle('visible', prikazi);
  if(box) box.classList.toggle('matchday', prikazi);
}

let zadnjiPrikazaniKrog = null;

function updateCountdown(){
  const next = getNextFixture();
  const labelEl = document.getElementById('nextMatchLabel');
  const noteEl = document.getElementById('countdownNote');

  if(!next){
    if(zadnjiPrikazaniKrog !== 'konec'){
      labelEl.innerHTML = "Sezona 2026/27 je zaključena 🏁";
      zadnjiPrikazaniKrog = 'konec';
    }
    document.getElementById('cd-days').textContent = "00";
    document.getElementById('cd-hours').textContent = "00";
    document.getElementById('cd-mins').textContent = "00";
    document.getElementById('cd-secs').textContent = "00";
    nastaviMatchdayOznako(false);
    return;
  }

  nastaviMatchdayOznako(next.datum === danasnjiDatumLjubljana());

  if(zadnjiPrikazaniKrog !== next.krog){
    const domHtml = next.dom === "Maribor" ? '<span class="maribor">Maribor</span>' : next.dom;
    const gostHtml = next.gost === "Maribor" ? '<span class="maribor">Maribor</span>' : next.gost;
    const uraPrikaz = next.ura || ASSUMED_KICKOFF.slice(0,5);
    const {dan, label} = formatDate(next.datum);
    const labelBrezLeta = label.replace(/\s\d{4}$/, '');
    const uraHtml = next.uraPotrjena
      ? `<span class="kickoff-time confirmed">${dan}, ${labelBrezLeta} · ${uraPrikaz}</span>`
      : `<span class="kickoff-time tentative">${dan}, ${labelBrezLeta} · predvidoma ${uraPrikaz}</span>`;
    labelEl.innerHTML = `<div class="match-title-grbi">
        <img class="match-title-grb" src="${GRBI_KLUBOV[next.dom] || 'grb.png'}" alt="${next.dom}">
        <span class="match-title-vs">${next.derby ? '⚡' : '—'}</span>
        <img class="match-title-grb" src="${GRBI_KLUBOV[next.gost] || 'grb.png'}" alt="${next.gost}">
      </div>
      <span class="kickoff-line">${uraHtml}</span>`;
    zadnjiPrikazaniKrog = next.krog;
  }

  const diff = next.kickoff.getTime() - Date.now();
  const totalSec = Math.max(0, Math.floor(diff / 1000));
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;

  document.getElementById('cd-days').textContent = pad(days);
  document.getElementById('cd-hours').textContent = pad(hours);
  document.getElementById('cd-mins').textContent = pad(mins);
  const secEl = document.getElementById('cd-secs');
  secEl.textContent = pad(secs);
  secEl.classList.remove('pop');
  void secEl.offsetWidth; // reflow, da se animacija lahko ponovno sproži
  secEl.classList.add('pop');
}

/* FORMA - zadnjih 5 tekem, od najstarejše do najnovejše: Z = zmaga, N = neodločeno, P = poraz
   Maribor se izračuna sam iz REZULTATI. Za ostale klube vpiši niz, npr. "ZZNPZ".
   Vrstni red je po datumu odigrane tekme (preložene tekme štejejo po dejanskem datumu).
   Zadnja posodobitev: po 10. krogu. Prazen niz = sivi krogci. */
const FORMA_RUCNO = {
  "Aluminij": "PPNZN",
  "Bravo": "PZNZZ",
  "Brinje-Grosuplje": "PZPPZ",
  "Celje": "PZPPN",
  "Kalcer Radomlje": "PNPPP",
  "Koper": "ZZZPZ",
  "Mura": "PPNPN",
  "Nafta 1903": "PPZZP",
  "Olimpija": "ZNZZP",
};

function formaMariborja(){
  let niz = '';
  fixtures.forEach(f => {
    const r = REZULTATI[f[0]];
    if(!r) return;
    const [d, g] = r.split(':').map(Number);
    const doma = f[2] === 'Maribor';
    const za = doma ? d : g, proti = doma ? g : d;
    niz += za > proti ? 'Z' : za < proti ? 'P' : 'N';
  });
  return niz;
}

function formaHtml(klub){
  const vir = klub === 'Maribor' ? formaMariborja() : (FORMA_RUCNO[klub] || '');
  const znaki = vir.toUpperCase().split('').filter(c => 'ZNP'.includes(c)).slice(-5);
  const naslov = {Z:'Zmaga', N:'Neodločeno', P:'Poraz'};
  let out = znaki.map(c => `<span class="fo fo-${c.toLowerCase()}" title="${naslov[c]}">${c}</span>`).join('');
  for(let i = znaki.length; i < 5; i++) out = '<span class="fo fo-prazno">–</span>' + out;
  return `<span class="forma">${out}</span>`;
}

function prazenSeznamKlubov(){
  return KLUBI_26_27.map((name, i) => ({
    position: i + 1,
    name,
    played: 0, wins: 0, draws: 0, losses: 0,
    goalsFor: 0, goalsAgainst: 0, diff: 0, points: 0,
    isMaribor: name === "Maribor",
  }));
}

function izracunajLestvico(){
  const sezonaSeZacela = Object.values(LESTVICA_PODATKI).some(t => t.played > 0);

  let teams = Object.entries(LESTVICA_PODATKI).map(([name, s]) => ({
    name,
    played: s.played,
    wins: s.wins,
    draws: s.draws,
    losses: s.losses,
    goalsFor: s.goalsFor,
    goalsAgainst: s.goalsAgainst,
    diff: s.goalsFor - s.goalsAgainst,
    points: s.wins * 3 + s.draws,
    isMaribor: name === "Maribor",
  }));

  if(sezonaSeZacela){
    // razvrstitev: točke, nato gol razlika, nato doseženi goli
    teams.sort((a,b) => b.points - a.points || b.diff - a.diff || b.goalsFor - a.goalsFor || a.name.localeCompare(b.name, 'sl'));
  } else {
    // dokler sezona ne steče, razvrstimo po abecedi
    teams.sort((a,b) => a.name.localeCompare(b.name, 'sl'));
  }
  teams = teams.map((t, i) => ({...t, position: i + 1}));

  return { teams, sezonaSeZacela };
}

function conaZaPozicijo(position, steviloKlubov){
  if(position === 1) return {key:'cl', label:'Liga prvakov'};
  if(position === 2 || position === 3) return {key:'conf', label:'Konferenčna liga'};
  if(position === steviloKlubov - 1) return {key:'warn', label:'Kvalifikacije za obstanek'};
  if(position === steviloKlubov) return {key:'out', label:'Izpad'};
  return null;
}

function nalozLestvico(){
  const contentEl = document.getElementById('lestvicaContent');
  const updatedEl = document.getElementById('lestvicaUpdated');

  const { teams, sezonaSeZacela } = izracunajLestvico();

  const steviloKlubov = teams.length;
  let rows = teams.map(t => {
    const cona = conaZaPozicijo(t.position, steviloKlubov);
    const zoneClass = cona ? `zone-${cona.key}` : '';
    const cls = [t.isMaribor ? 'maribor-row' : '', zoneClass].filter(Boolean).join(' ');

    const prejsnja = PREJSNJA_POZICIJA[t.name];
    let gibanje = '<span class="gib gib-enako" title="Brez spremembe"></span>';
    if(prejsnja !== undefined){
      if(t.position < prejsnja) gibanje = '<span class="gib gib-gor" title="Napredovanje"></span>';
      else if(t.position > prejsnja) gibanje = '<span class="gib gib-dol" title="Nazadovanje"></span>';
      else gibanje = '<span class="gib gib-enako" title="Brez spremembe"></span>';
    }

    return `
    <tr class="${cls}">
      <td class="pos"><span class="pos-badge">${t.position}</span>${gibanje}</td>
      <td class="name-col">
        <img class="lestvica-grb" src="${GRBI_KLUBOV[t.name] || ''}" alt="" loading="lazy">
        ${t.isMaribor ? `<span class="maribor-klik" title="Prikaži kader">${t.name}</span>` : t.name}
      </td>
      <td>${t.played}</td>
      <td>${t.wins}</td>
      <td>${t.draws}</td>
      <td>${t.losses}</td>
      <td>${t.goalsFor}:${t.goalsAgainst}</td>
      <td>${t.diff > 0 ? '+' : ''}${t.diff}</td>
      <td class="points"><span class="points-pill">${t.points}</span></td>
      <td class="forma-col">${formaHtml(t.name)}</td>
    </tr>
  `;
  }).join('');

  contentEl.outerHTML = `
    <div class="lestvica-scroll-wrap" style="overflow-x:auto;">
      ${!sezonaSeZacela ? '<div class="lestvica-note" style="padding:8px 14px;text-align:left;">Sezona se še ni začela — klubi so razvrščeni po abecedi.</div>' : ''}
      <table class="lestvica" id="lestvicaContent">
        <thead>
          <tr>
            <th></th>
            <th class="name-col">Klub</th>
            <th title="Odigrane">T</th>
            <th title="Zmage">Z</th>
          <th title="Neodločeno">N</th>
          <th title="Porazi">P</th>
          <th title="Goli">D:P</th>
          <th title="Gol razlika">+/-</th>
          <th title="Točke">T</th>
          <th title="Zadnjih 5 tekem (najnovejša desno)">Forma</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <div class="lestvica-legend">
        <span><span class="legend-dot" style="background:var(--liga-prvakov);"></span> Liga prvakov</span>
        <span><span class="legend-dot" style="background:var(--konferencna);"></span> Konferenčna liga</span>
        <span><span class="legend-dot" style="background:var(--kvalifikacije);"></span> Kvalifikacije za obstanek</span>
        <span><span class="legend-dot" style="background:var(--derby);"></span> Izpad</span>
      </div>`;

  if(updatedEl){
    updatedEl.textContent = "";
  }
}

nalozLestvico();

/* ===== DELI STRAN ===== */
const shareBtn = document.getElementById('shareToggle');
const shareToast = document.getElementById('shareToast');

function pokaziShareToast(besedilo){
  shareToast.textContent = besedilo;
  shareToast.classList.add('visible');
  clearTimeout(pokaziShareToast._t);
  pokaziShareToast._t = setTimeout(() => shareToast.classList.remove('visible'), 2200);
}

shareBtn.addEventListener('click', async () => {
  const url = window.location.href;
  const podatkiDeljenja = {
    title: 'NK Maribor — Razpored 2026/27',
    text: 'Spored, lestvica in odštevalnik do naslednje tekme NK Maribor 💜',
    url
  };

  // Ikona in manifest sta zdaj v ločenih datotekah (icon.png, manifest.json)
  // namesto vgrajena kot base64, zato navigator.share() ne povzroča več
  // sesutja zavihka (RESULT_CODE_KILLED_BAD_MESSAGE).
  if(navigator.share){
    try{
      await navigator.share(podatkiDeljenja);
    }catch(err){
      // uporabnik je preklical deljenje ali napaka - tiho preskočimo
    }
    return;
  }

  try{
    await navigator.clipboard.writeText(url);
    shareBtn.classList.add('copied');
    pokaziShareToast('Povezava kopirana!');
    setTimeout(() => shareBtn.classList.remove('copied'), 1600);
  }catch(err){
    // Zadnja rešitev za brskalnike brez Clipboard API - ročno izbrana povezava
    try{
      const zacasno = document.createElement('textarea');
      zacasno.value = url;
      zacasno.style.position = 'fixed';
      zacasno.style.opacity = '0';
      document.body.appendChild(zacasno);
      zacasno.select();
      document.execCommand('copy');
      document.body.removeChild(zacasno);
      shareBtn.classList.add('copied');
      pokaziShareToast('Povezava kopirana!');
      setTimeout(() => shareBtn.classList.remove('copied'), 1600);
    }catch(err2){
      pokaziShareToast(url);
    }
  }
});
</script>

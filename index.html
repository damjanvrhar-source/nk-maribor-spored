<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>NK Maribor - sij okrog črk</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #1a0a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }

  .content {
    text-align: center;
  }

  .title, .year {
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
  }

  .title {
    font-size: 64px;
    letter-spacing: 4px;
    font-weight: 900;
  }

  .year {
    font-size: 20px;
    letter-spacing: 6px;
    font-weight: 700;
    margin-top: 10px;
  }

  .letter {
    position: relative;
    display: inline-block;
    color: #ffffff;
  }

  .letter.space {
    width: 0.5em;
  }

  /* orbiting glow dot around each letter */
  .letter::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 65%;
    height: 65%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 224, 120, 0.95) 0%, rgba(255, 205, 60, 0.6) 40%, rgba(255, 205, 60, 0) 75%);
    filter: blur(3px);
    transform-origin: center;
    animation: orbit 2.6s linear infinite;
    animation-delay: var(--delay, 0s);
    z-index: 0;
    pointer-events: none;
  }

  .letter span {
    position: relative;
    z-index: 1;
  }

  @keyframes orbit {
    0%   { transform: translate(-50%, -50%) rotate(0deg) translateX(0.85em) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg) translateX(0.85em) rotate(-360deg); }
  }
</style>
</head>
<body>
  <div class="content">
    <div class="title" id="title"></div>
    <div class="year" id="year"></div>
  </div>

  <script>
    function buildLetters(containerId, text, baseDelay) {
      const container = document.getElementById(containerId);
      const chars = text.split('');
      chars.forEach((ch, i) => {
        const el = document.createElement('span');
        el.className = 'letter' + (ch === ' ' ? ' space' : '');
        el.style.setProperty('--delay', (i * 0.12) + 's');
        if (ch !== ' ') {
          const inner = document.createElement('span');
          inner.textContent = ch;
          el.appendChild(inner);
        }
        container.appendChild(el);
      });
    }

    buildLetters('title', 'NK MARIBOR');
    buildLetters('year', '1960');
  </script>
</body>
</html>

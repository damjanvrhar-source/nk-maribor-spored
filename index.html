




<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>NK Maribor — Razpored 2026/27</title>
<style>
  :root{
    --vijola:#5b1f8c;
    --vijola-2:#7b2fb5;
    --vijola-dark:#2e0f4d;
    --vijola-darker:#1c0930;
    --zlata:#f5c518;
    --zlata-dark:#c99a00;
    --bg:#f4ecff;
    --card:#ffffff;
    --text:#241536;
    --muted:#7d6d95;
    --derby:#e8332e;
    --liga-prvakov:#7b2fb5;
    --konferencna:#2f7cd6;
    --kvalifikacije:#2e9e5b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    overflow-anchor:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #7b2fb522 0%, transparent 45%),
      radial-gradient(circle at 100% 10%, #f5c51822 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    padding:20px;
    position:relative;
    overflow-x:hidden;
  }
  body::before, body::after{
    content:"";
    position:fixed;
    width:520px;height:520px;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.16;
    z-index:-1;
    pointer-events:none;
  }
  body::before{
    top:-180px; left:-160px;
    background:radial-gradient(circle, var(--vijola-2), transparent 70%);
    animation:blobFloat1 16s ease-in-out infinite;
  }
  body::after{
    bottom:-200px; right:-160px;
    background:radial-gradient(circle, var(--zlata), transparent 70%);
    animation:blobFloat2 20s ease-in-out infinite;
  }
  @keyframes blobFloat1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(40px,60px) scale(1.15); }
  }
  @keyframes blobFloat2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-50px,-40px) scale(1.2); }
  }
  #introScreen{
    position:fixed;
    inset:0;
    z-index:1000;
    background:radial-gradient(circle at 50% 40%, var(--vijola-2) 0%, var(--vijola-dark) 70%, #14081f 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    overflow:hidden;
    animation:introOut .7s cubic-bezier(.5,0,.7,0) 3.9s forwards;
  }
  @keyframes introOut{
    0%{ opacity:1; visibility:visible; transform:scale(1); }
    99%{ opacity:0; visibility:visible; transform:scale(1.3); }
    100%{ opacity:0; visibility:hidden; pointer-events:none; transform:scale(1.3); }
  }
  .intro-halo{
    position:absolute;
    width:250px; height:250px;
    border-radius:50%;
    border:2px solid rgba(245,197,24,0.5);
    animation:introHaloPulse 1.8s ease-out .3s infinite;
  }
  .intro-halo-2{
    position:absolute;
    width:250px; height:250px;
    border-radius:50%;
    border:2px solid rgba(245,197,24,0.35);
    animation:introHaloPulse 1.8s ease-out .9s infinite;
  }
  @keyframes introHaloPulse{
    0%{ transform:scale(0.4); opacity:0.9; }
    100%{ transform:scale(1.6); opacity:0; }
  }
  .intro-slogan{
    color:var(--zlata);
    font-size:11px;
    font-weight:800;
    letter-spacing:3px;
    text-shadow:0 2px 6px rgba(0,0,0,0.5);
    animation:introCrestPop 1s cubic-bezier(.34,1.56,.64,1) both,
              introGrow 2.9s ease-in 1s forwards;
  }
  .intro-crest{
    width:190px;
    height:190px;
    object-fit:contain;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,0.5)) drop-shadow(0 0 22px rgba(245,197,24,0.45));
    animation:introCrestPop 1s cubic-bezier(.34,1.56,.64,1) both,
              introGrow 2.9s ease-in 1s forwards;
    position:relative;
  }
  @keyframes introCrestPop{
    0%{ opacity:0; transform:scale(0.2) rotate(-40deg); }
    60%{ opacity:1; transform:scale(1.12) rotate(6deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  @keyframes introGrow{
    0%{ transform:scale(1); }
    100%{ transform:scale(1.35); }
  }
  .intro-title{
    color:#fff;
    font-size:40px;
    font-weight:900;
    letter-spacing:1.5px;
    text-shadow:0 4px 16px rgba(0,0,0,0.5);
    opacity:0;
    animation:introTitleIn .6s ease .5s forwards;
  }
  @keyframes introTitleIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .intro-accent{
    background:linear-gradient(90deg, var(--zlata) 0%, #fff6d0 50%, var(--zlata) 100%);
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:accentShine 2s linear infinite;
  }
  .intro-subtitle{
    color:#e7d7fa;
    font-size:13px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:0;
    animation:introTitleIn .5s ease .75s forwards;
  }
  .intro-dots{
    display:flex;
    gap:8px;
    margin-top:6px;
    opacity:0;
    animation:introTitleIn .5s ease 1.05s forwards;
  }
  .intro-dots span{
    width:9px;height:9px;border-radius:50%;
    background:var(--zlata);
    animation:introDotBounce 1s ease-in-out infinite;
  }
  .intro-dots span:nth-child(2){animation-delay:.15s;}
  .intro-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes introDotBounce{
    0%,100%{ transform:translateY(0); opacity:0.5; }
    50%{ transform:translateY(-8px); opacity:1; }
  }
  .wrap{max-width:920px;margin:0 auto;position:relative;z-index:1;}

  header{
    position:relative;
    background:linear-gradient(150deg,var(--vijola-2) 0%,var(--vijola) 45%,var(--vijola-dark) 100%);
    color:#fff;
    border-radius:20px;
    padding:0;
    margin-bottom:26px;
    overflow:hidden;
    box-shadow:0 14px 34px rgba(46,15,77,0.35);
    border:2px solid var(--zlata);
    animation:headerEnter .6s cubic-bezier(.21,.86,.4,1) both, headerGlow 4s ease-in-out 1s infinite;
  }
  @keyframes headerEnter{
    0%{ opacity:0; transform:translateY(-18px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  @keyframes headerGlow{
    0%,100%{ box-shadow:0 14px 34px rgba(46,15,77,0.35); }
    50%{ box-shadow:0 14px 34px rgba(46,15,77,0.35), 0 0 26px rgba(245,197,24,0.35); }
  }
  header::before{
    content:"";
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(120deg, transparent 0 60px, rgba(245,197,24,0.06) 60px 64px);
    background-size:200% 200%;
    animation:headerShine 8s linear infinite;
    pointer-events:none;
  }
  @keyframes headerShine{
    0%{ background-position:0% 0%; }
    100%{ background-position:120px 0%; }
  }
  .header-inner{
    position:relative;
    display:flex;
    align-items:center;
    gap:22px;
    padding:22px 28px;
    flex-wrap:wrap;
  }
  .crest{
    flex-shrink:0;
    width:88px;
    height:88px;
    object-fit:contain;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    animation:crestEnter .7s cubic-bezier(.34,1.56,.64,1) both,
              crestGlow 3.5s ease-in-out .7s infinite,
              crestSway 6s ease-in-out .7s infinite;
    transform-origin:50% 90%;
  }
  @keyframes crestEnter{
    0%{ opacity:0; transform:scale(0.4) rotate(-25deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes crestGlow{
    0%,100%{ filter:drop-shadow(0 4px 10px rgba(0,0,0,0.35)) drop-shadow(0 0 0 rgba(245,197,24,0)); }
    50%{ filter:drop-shadow(0 4px 14px rgba(0,0,0,0.4)) drop-shadow(0 0 18px rgba(245,197,24,0.55)); }
  }
  @keyframes crestSway{
    0%,100%{ transform:rotate(0deg); }
    25%{ transform:rotate(-3deg); }
    75%{ transform:rotate(3deg); }
  }
  .header-text{flex:1;min-width:220px;}
  header h1{
    margin:0 0 8px;
    font-size:44px;
    font-weight:900;
    letter-spacing:0.5px;
    text-shadow:0 4px 18px rgba(0,0,0,0.5);
    animation:titlePop .8s cubic-bezier(.2,1.4,.4,1) both, titleFlash 1.4s ease-out .8s;
  }
  @keyframes titlePop{
    0%{ opacity:0; transform:scale(1.5) translateY(-14px); filter:blur(8px); }
    55%{ opacity:1; transform:scale(0.94) translateY(2px); filter:blur(0); }
    75%{ transform:scale(1.03); }
    100%{ transform:scale(1); }
  }
  @keyframes titleFlash{
    0%{ text-shadow:0 4px 18px rgba(0,0,0,0.5), 0 0 40px rgba(245,197,24,0.9); }
    100%{ text-shadow:0 4px 18px rgba(0,0,0,0.5), 0 0 0 rgba(245,197,24,0); }
  }
  header h1 .accent{
    background:linear-gradient(90deg, var(--zlata) 0%, #fff6d0 50%, var(--zlata) 100%);
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:accentShine 3.5s linear infinite;
  }
  @keyframes accentShine{
    0%{ background-position:0% 0; }
    100%{ background-position:-200% 0; }
  }
  header p.sub{
    margin:0;
    opacity:0.95;
    font-size:16px;
    font-weight:600;
    letter-spacing:0.4px;
    text-shadow:0 2px 8px rgba(0,0,0,0.35);
    animation:subFadeIn .6s cubic-bezier(.21,.86,.4,1) .7s both;
  }
  @keyframes subFadeIn{
    0%{ opacity:0; transform:translateY(10px) scale(0.9); }
    100%{ opacity:0.95; transform:translateY(0) scale(1); }
  }
  .header-slogan{
    margin:4px 0 8px;
    color:var(--zlata);
    font-size:13px;
    font-weight:800;
    letter-spacing:2.5px;
    text-shadow:0 2px 6px rgba(0,0,0,0.4);
    opacity:0;
    animation:subFadeIn .6s cubic-bezier(.21,.86,.4,1) .55s forwards;
  }
  .stripe-bar{
    height:10px;
    width:100%;
    position:relative;
    overflow:hidden;
    background:repeating-linear-gradient(90deg,var(--zlata) 0 24px,var(--vijola-2) 24px 48px);
    background-size:96px 10px;
    animation:stripeMove 2.5s linear infinite;
  }
  @keyframes stripeMove{
    0%{ background-position:0 0; }
    100%{ background-position:96px 0; }
  }
  .stripe-bar::after{
    content:"";
    position:absolute; inset:0;
    width:40%;
    background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.65) 50%, transparent 100%);
    animation:stripeShine 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes stripeShine{
    0%{ transform:translateX(-140%); }
    100%{ transform:translateX(360%); }
  }

  .polsezon{
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:#fff;
    font-weight:800;
    margin:30px 0 12px;
    padding:8px 16px;
    background:linear-gradient(90deg,var(--vijola),var(--vijola-2));
    background-size:200% 100%;
    border-left:5px solid var(--zlata);
    border-radius:8px;
    display:inline-block;
    opacity:0;
    transform:translateX(-24px);
  }
  .polsezon.visible{
    animation:polsezonEnter .6s cubic-bezier(.21,.86,.4,1) forwards,
              polsezonSheen 2.5s ease .6s 1;
  }
  @keyframes polsezonEnter{
    to{ opacity:1; transform:translateX(0); }
  }
  @keyframes polsezonSheen{
    0%{ background-position:100% 0; }
    100%{ background-position:0 0; }
  }

  .match{
    background:var(--card);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 2px 8px rgba(46,15,77,0.09);
    border-left:5px solid var(--zlata);
    border-top:1px solid #eee2ff;
    transition:transform .18s ease, box-shadow .18s ease;
    opacity:0;
    transform:translateY(18px) scale(0.97);
  }
  .match.visible{
    animation:matchFadeIn .55s cubic-bezier(.21,.86,.4,1) forwards;
  }
  @keyframes matchFadeIn{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .match:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(46,15,77,0.16);
  }
  .match.next-up{
    animation:matchFadeIn .55s cubic-bezier(.21,.86,.4,1) forwards, nextUpPulse 2.2s ease-in-out .55s infinite;
  }
  @keyframes nextUpPulse{
    0%,100%{ box-shadow:0 2px 6px rgba(46,15,77,0.08), 0 0 0 rgba(245,197,24,0.5); }
    50%{ box-shadow:0 4px 14px rgba(46,15,77,0.14), 0 0 14px rgba(245,197,24,0.6); }
  }
  .match.away{border-left-color:#d8c8ee;}
  .match.derby{
    border-left-color:var(--derby);
    background:linear-gradient(90deg,#fff 0%, #fff6f2 100%);
    box-shadow:0 3px 10px rgba(232,51,46,0.15);
  }

  .krog{
    font-size:11px;
    color:#fff;
    width:56px;
    flex-shrink:0;
    text-align:center;
    font-weight:800;
    background:var(--vijola);
    border-radius:8px;
    padding:6px 4px;
    transition:transform .25s ease, background-color .25s ease;
  }
  .match:hover .krog{
    transform:scale(1.08) rotate(-2deg);
    background:var(--vijola-2);
  }
  .datum{
    width:150px;
    flex-shrink:0;
    font-size:13px;
    font-weight:700;
    color:var(--vijola-dark);
  }
  .datum .dan{
    display:block;
    font-size:11px;
    font-weight:400;
    color:var(--muted);
    text-transform:capitalize;
  }
  .tekma{
    flex:1;
    font-size:15px;
    font-weight:800;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    min-width:0;
  }
  .tekma-glavno{
    display:grid;
    grid-template-columns:95px auto 1fr;
    align-items:center;
    gap:6px;
    width:100%;
  }
  .tekma-glavno > *:first-child{ text-align:right; }
  .tekma-glavno > *:last-child{ text-align:left; }
  .rezultat{
    display:inline-block;
    background:var(--vijola);
    color:#fff;
    font-weight:900;
    font-size:13.5px;
    padding:2px 10px;
    border-radius:8px;
    margin:0 4px;
    animation:pillPop .3s ease backwards, rezultatGlow 2.4s ease-in-out .3s infinite;
  }
  @keyframes rezultatGlow{
    0%,100%{ box-shadow:0 0 0 rgba(245,197,24,0); }
    50%{ box-shadow:0 0 10px rgba(245,197,24,0.65); }
  }
  .match.played{
    border-left-color:var(--vijola-2);
  }
  .match.played .badge{
    opacity:0.65;
  }
  .tekma .maribor{color:var(--vijola-2);position:relative;display:inline-block;}
  .tekma .tim{white-space:nowrap;}
  .tekma .maribor::after{
    content:"";
    position:absolute;left:0;right:0;bottom:-2px;height:3px;
    border-radius:2px;
    background:linear-gradient(90deg, var(--zlata) 0%, #fff2b8 50%, var(--zlata) 100%);
    background-size:220% auto;
    animation:mariborUnderline 3s linear infinite;
  }
  @keyframes mariborUnderline{
    0%{ background-position:0% 0; }
    100%{ background-position:-220% 0; }
  }
  .venue{
    font-size:12px;
    color:var(--muted);
    text-align:right;
    width:170px;
    flex-shrink:0;
  }
  .match.home .venue{
    color:var(--vijola-2);
    font-weight:800;
  }
  .badge{
    display:inline-block;
    font-size:10px;
    font-weight:800;
    padding:3px 9px;
    border-radius:20px;
    margin-left:8px;
    vertical-align:middle;
    letter-spacing:0.3px;
    box-shadow:0 2px 5px rgba(0,0,0,0.12);
  }
  .badge.h{background:var(--zlata);color:#4a3800;position:relative;}
  .badge.h::after{
    content:"";
    position:absolute; inset:-8px -12px;
    background-image:
      radial-gradient(circle, var(--zlata) 2px, transparent 2.5px),
      radial-gradient(circle, var(--vijola-2) 2px, transparent 2.5px),
      radial-gradient(circle, var(--derby) 1.6px, transparent 2px),
      radial-gradient(circle, var(--vijola) 1.6px, transparent 2px);
    background-position:0 20%, 100% 10%, 25% 100%, 75% 90%;
    background-repeat:no-repeat;
    opacity:0;
    pointer-events:none;
  }
  .match.home:hover .badge.h::after{
    animation:confettiBurst .65s ease-out;
  }
  @keyframes confettiBurst{
    0%{ opacity:1; transform:scale(0.3) translateY(0) rotate(0deg); }
    100%{ opacity:0; transform:scale(1.4) translateY(-16px) rotate(35deg); }
  }
  .badge.a{background:#ede4fa;color:var(--vijola);}
  .badge.derby{background:var(--derby);color:#fff;animation:derbyPulse 1.6s ease-in-out infinite;}
  @keyframes derbyPulse{
    0%,100%{ box-shadow:0 0 0 rgba(232,51,46,0.5); }
    50%{ box-shadow:0 0 10px rgba(232,51,46,0.75); }
  }

  footer{
    margin-top:34px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
    line-height:1.7;
    padding-bottom:10px;
  }
  footer .foot-crest{
    opacity:0.6;
    margin-bottom:8px;
    display:inline-block;
    animation:footCrestFloat 3s ease-in-out infinite;
  }
  @keyframes footCrestFloat{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-4px) rotate(6deg); }
  }

  /* ===== COUNTDOWN ===== */
  /* ===== TOP ROW: odštevalnik (levo) + lestvica (desno) ===== */
  .top-row{
    display:flex;
    gap:18px;
    align-items:stretch;
    margin-bottom:22px;
  }
  .top-row .countdown{
    flex:1;
    min-width:0;
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    animation:slideInLeft .6s .15s cubic-bezier(.21,.86,.4,1) both, countdownGlow 3s ease-in-out .75s infinite;
  }
  .top-row .table-wrap{
    flex:1;
    min-width:0;
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    animation:slideInRight .6s .25s cubic-bezier(.21,.86,.4,1) both;
  }
  @keyframes slideInLeft{
    0%{ opacity:0; transform:translateX(-24px); }
    100%{ opacity:1; transform:translateX(0); }
  }
  @keyframes slideInRight{
    0%{ opacity:0; transform:translateX(24px); }
    100%{ opacity:1; transform:translateX(0); }
  }
  .top-row .table-wrap > div:last-child{
    flex:1;
  }
  @media(max-width:800px){
    .top-row{flex-direction:column;}
    .top-row .countdown{flex:none;}
  }

  .countdown{
    background:
      linear-gradient(150deg, rgba(46,15,77,0.35) 0%, rgba(91,31,140,0.3) 100%),
      url('slika2.jpg') center top / cover no-repeat;
    border:2px solid var(--zlata);
    border-radius:18px;
    padding:20px 24px;
    margin-bottom:26px;
    color:#fff;
    text-align:center;
    box-shadow:0 10px 26px rgba(46,15,77,0.3);
    position:relative;
    overflow:hidden;
  }
  @keyframes countdownGlow{
    0%,100%{ box-shadow:0 10px 26px rgba(46,15,77,0.3), 0 0 0 rgba(245,197,24,0); }
    50%{ box-shadow:0 10px 30px rgba(46,15,77,0.35), 0 0 24px rgba(245,197,24,0.35); }
  }
  .countdown .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--zlata);
    font-weight:800;
    margin-bottom:8px;
  }
  .countdown .next-match{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:16px;
  }
  .countdown .match-title{
    font-size:22px;
    font-weight:900;
    letter-spacing:0.3px;
    text-shadow:0 2px 10px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.5);
    animation:nextMatchPop .7s cubic-bezier(.34,1.56,.64,1) both, textFlicker 3s ease-in-out .7s infinite;
  }
  .countdown .kickoff-line{
    margin-top:6px;
    font-size:22px;
    animation:nextMatchPop .6s cubic-bezier(.34,1.56,.64,1) .15s both;
  }
  @keyframes nextMatchPop{
    0%{ opacity:0; transform:scale(0.85) translateY(8px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  @keyframes textFlicker{
    0%,100%{ text-shadow:0 2px 10px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.5); }
    50%{ text-shadow:0 2px 10px rgba(0,0,0,0.85), 0 0 14px rgba(245,197,24,0.4); }
  }
  .countdown .next-match .maribor{color:var(--zlata);}
  .countdown .venue-mini{
    font-size:13px;
    font-weight:600;
    display:block;
    margin-top:8px;
    text-shadow:0 2px 8px rgba(0,0,0,0.85);

<script>
if("scrollRestoration" in history){ history.scrollRestoration = "manual"; }
window.scrollTo(0, 0);
// Uradno potrjene ure tekem (sproti dopolnjujemo, ko jih prvaliga.si objavi)
const POTRJENE_URE = {
  1: "18:00",
  2: "20:15",
  3: "20:15",
  4: "20:15",
};

const fixtures = [
 [1,"2026-07-19","Aluminij","Maribor","Športni park Kidričevo",false],
 [2,"2026-07-25","Maribor","Brinje-Grosuplje","Ljudski vrt Maribor",true],
 [3,"2026-08-01","Celje","Maribor","Arena Z'dežele",false],
 [4,"2026-08-09","Maribor","Koper","Ljudski vrt Maribor",true],
 [5,"2026-08-15","Olimpija","Maribor","Stadion Stožice",false,"derby"],
 [6,"2026-08-22","Maribor","Bravo","Ljudski vrt Maribor",true],
 [7,"2026-08-29","Nafta 1903","Maribor","Nafta 1903",false],
 [8,"2026-09-05","Maribor","Mura","Ljudski vrt Maribor",true],
 [9,"2026-09-12","Kalcer Radomlje","Maribor","Športni park Domžale",false],
 [10,"2026-09-19","Maribor","Aluminij","Ljudski vrt Maribor",true],
 [11,"2026-10-10","Brinje-Grosuplje","Maribor","Brinje-Grosuplje",false],
 [12,"2026-10-17","Maribor","Celje","Ljudski vrt Maribor",true],
 [13,"2026-10-28","Koper","Maribor","ŠRC Bonifika",false],
 [14,"2026-10-31","Maribor","Olimpija","Ljudski vrt Maribor",true,"derby"],
 [15,"2026-11-07","Bravo","Maribor","Športni park Šiška",false],
 [16,"2026-11-21","Maribor","Nafta 1903","Ljudski vrt Maribor",true],
 [17,"2026-11-28","Mura","Maribor","Mestni stadion Fazanerija",false],
 [18,"2026-12-05","Maribor","Kalcer Radomlje","Ljudski vrt Maribor",true],
 [19,"2027-01-30","Aluminij","Maribor","Športni park Kidričevo",false],
 [20,"2027-02-06","Maribor","Brinje-Grosuplje","Ljudski vrt Maribor",true],
 [21,"2027-02-10","Celje","Maribor","Arena Z'dežele",false],
 [22,"2027-02-13","Maribor","Koper","Ljudski vrt Maribor",true],
 [23,"2027-02-20","Olimpija","Maribor","Stadion Stožice",false,"derby"],
 [24,"2027-02-27","Maribor","Bravo","Ljudski vrt Maribor",true],
 [25,"2027-03-06","Nafta 1903","Maribor","Nafta 1903",false],
 [26,"2027-03-13","Maribor","Mura","Ljudski vrt Maribor",true],
 [27,"2027-03-20","Kalcer Radomlje","Maribor","Športni park Domžale",false],
 [28,"2027-04-03","Maribor","Aluminij","Ljudski vrt Maribor",true],
 [29,"2027-04-10","Brinje-Grosuplje","Maribor","Brinje-Grosuplje",false],
 [30,"2027-04-14","Maribor","Celje","Ljudski vrt Maribor",true],
 [31,"2027-04-17","Koper","Maribor","ŠRC Bonifika",false],
 [32,"2027-04-24","Maribor","Olimpija","Ljudski vrt Maribor",true,"derby"],
 [33,"2027-05-01","Bravo","Maribor","Športni park Šiška",false],
 [34,"2027-05-08","Maribor","Nafta 1903","Ljudski vrt Maribor",true],
 [35,"2027-05-15","Mura","Maribor","Mestni stadion Fazanerija",false],
 [36,"2027-05-22","Maribor","Kalcer Radomlje","Ljudski vrt Maribor",true],
];

const dnevi = ["nedelja","ponedeljek","torek","sreda","četrtek","petek","sobota"];
const meseci = ["jan","feb","mar","apr","maj","jun","jul","avg","sep","okt","nov","dec"];

function formatDate(iso){
  const d = new Date(iso+"T12:00:00");
  const dan = dnevi[d.getDay()];
  const dd = d.getDate();
  const mes = meseci[d.getMonth()];
  return {dan, label: `${dd}. ${mes} ${d.getFullYear()}`};
}

const container = document.getElementById('fixtures');
let currentHalf = null;

/* ROČNO VNESENI REZULTATI ODIGRANIH TEKEM
   Ko je tekma odigrana, se tu doda: krog: "goli_doma:goli_gostov" */
const REZULTATI = {
  1: "0:0",
  2: "3:0",
  3: "1:1",
};

fixtures.forEach(f => {
  const [krog, datum, dom, gost, prizorisce, homeMatch, derby] = f;
  const isDerby = derby === "derby";

  const half = krog <= 18 ? "Jesenski del · 1.–18. krog" : "Spomladanski del · 19.–36. krog";
  if(half !== currentHalf){
    currentHalf = half;
    const h = document.createElement('div');
    h.className = 'polsezon';
    h.textContent = half;
    container.appendChild(h);
  }

  const {dan, label} = formatDate(datum);
  const ura = POTRJENE_URE[krog];
  const rezultat = REZULTATI[krog];

  const row = document.createElement('div');
  row.className = 'match ' + (homeMatch ? 'home' : 'away') + (isDerby ? ' derby' : '') + (rezultat ? ' played' : '');

  const domHtml = dom === "Maribor" ? '<span class="maribor">Maribor</span>' : `<span class="tim">${dom}</span>`;
  const gostHtml = gost === "Maribor" ? '<span class="maribor">Maribor</span>' : `<span class="tim">${gost}</span>`;

  row.innerHTML = `
    <div class="krog">${krog}. krog</div>
    <div class="datum">${label}<span class="dan">${rezultat ? 'Končano' : (ura ? dan + ' · ' + ura : '')}</span></div>
    <div class="tekma">
      <span class="tekma-glavno">${domHtml} ${rezultat ? `<span class="rezultat">${rezultat}</span>` : '—'} ${gostHtml}</span>
      ${isDerby ? '<span class="badge derby">VEČNI DERBI</span>' : (rezultat ? '' : (homeMatch ? '<span class="badge h">DOMA</span>' : '<span class="badge a">V GOSTEH</span>'))}
    </div>
    <div class="venue">${prizorisce}</div>
  `;
  row.id = `match-${krog}`;
  container.appendChild(row);
});

// Postopno pojavljanje vrstic razporeda pri skrolanju navzdol
const fadeObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry, i) => {
    if(entry.isIntersecting){
      setTimeout(() => entry.target.classList.add('visible'), i * 30);
      fadeObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.1, rootMargin: "0px 0px -40px 0px" });

document.querySelectorAll('.match, .polsezon').forEach(el => fadeObserver.observe(el));

/* ===== ODŠTEVALNIK DO NASLEDNJE TEKME ===== */
/* Ker uradne ure tekem še niso objavljene, uporabljamo oceno 18:00 (lokalni čas, Europe/Ljubljana). */
const ASSUMED_KICKOFF = "18:00:00";

function getNextFixture(){
  const now = new Date();
  for(const f of fixtures){
    const [krog, datum, dom, gost] = f;
    const uraTekme = POTRJENE_URE[krog] ? POTRJENE_URE[krog] + ":00" : ASSUMED_KICKOFF;
    const kickoff = new Date(`${datum}T${uraTekme}`);
    if(kickoff.getTime() > now.getTime()){
      return {
        krog, datum, dom, gost, kickoff, prizorisce: f[4], derby: f[5] === "derby",
        ura: POTRJENE_URE[krog] || null,
        uraPotrjena: !!POTRJENE_URE[krog]
      };
    }
  }
  return null;
}

function pad(n){ return String(n).padStart(2,"0"); }

function updateCountdown(){
  const next = getNextFixture();
  const labelEl = document.getElementById('nextMatchLabel');
  const noteEl = document.getElementById('countdownNote');

  if(!next){
    labelEl.innerHTML = "Sezona 2026/27 je zaključena 🏁";
    document.getElementById('cd-days').textContent = "00";
    document.getElementById('cd-hours').textContent = "00";
    document.getElementById('cd-mins').textContent = "00";
    document.getElementById('cd-secs').textContent = "00";
    return;
  }

  const domHtml = next.dom === "Maribor" ? '<span class="maribor">Maribor</span>' : next.dom;
  const gostHtml = next.gost === "Maribor" ? '<span class="maribor">Maribor</span>' : next.gost;
  const uraPrikaz = next.ura || ASSUMED_KICKOFF.slice(0,5);
  const uraHtml = next.uraPotrjena
    ? `<span class="kickoff-time confirmed">${uraPrikaz}</span>`
    : `<span class="kickoff-time tentative">predvidoma ${uraPrikaz}</span>`;
  labelEl.innerHTML = `<span class="match-title">${next.krog}. krog: ${domHtml} — ${gostHtml}${next.derby ? ' ⚡' : ''}</span>
    <span class="kickoff-line">${uraHtml}</span>
    <span class="venue-mini">${next.prizorisce}</span>`;

  const diff = next.kickoff.getTime() - Date.now();
  const totalSec = Math.max(0, Math.floor(diff / 1000));
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;

  document.getElementById('cd-days').textContent = pad(days);
  document.getElementById('cd-hours').textContent = pad(hours);
  document.getElementById('cd-mins').textContent = pad(mins);
  const secEl = document.getElementById('cd-secs');
  secEl.textContent = pad(secs);
  secEl.classList.remove('pop');
  void secEl.offsetWidth; // reflow, da se animacija lahko ponovno sproži
  secEl.classList.add('pop');
}

// Osvetlitev naslednje tekme v razporedu - nastavimo SAMO ENKRAT, ne vsako sekundo,
// da preprečimo morebitno "scroll anchoring" obnašanje brskalnika med skrolanjem.
function highlightNextMatch(){
  const next = getNextFixture();
  document.querySelectorAll('.match').forEach(el => el.classList.remove('next-up'));
  if(next){
    const rowEl = document.getElementById(`match-${next.krog}`);
    if(rowEl){ rowEl.classList.add('next-up'); }
  }
}
highlightNextMatch();
// osvežimo osvetlitev le enkrat na minuto (dovolj pogosto, brez tveganja za skrolanje)
setInterval(highlightNextMatch, 60000);

updateCountdown();
setInterval(updateCountdown, 1000);

/* ===== LESTVICA ===== */
const KLUBI_26_27 = [
  "Aluminij", "Bravo", "Brinje-Grosuplje", "Celje", "Kalcer Radomlje",
  "Koper", "Maribor", "Mura", "Nafta 1903", "Olimpija"
].sort((a,b) => a.localeCompare(b, 'sl'));

/* ROČNO POSODABLJANA LESTVICA
   Po vsakem odigranem krogu se tu posodobijo številke za posamezen klub.
   played = odigrane, wins = zmage, draws = neodločeno, losses = porazi,
   goalsFor = doseženi goli, goalsAgainst = prejeti goli.
   Zadnja posodobitev: pred 1. krogom (vsi na 0). */
const LESTVICA_PODATKI = {
  "Aluminij":          {played:2, wins:0, draws:1, losses:1, goalsFor:0, goalsAgainst:1},
  "Bravo":             {played:3, wins:2, draws:0, losses:1, goalsFor:4, goalsAgainst:4},
  "Brinje-Grosuplje":  {played:3, wins:1, draws:1, losses:1, goalsFor:3, goalsAgainst:4},
  "Celje":             {played:2, wins:0, draws:2, losses:0, goalsFor:3, goalsAgainst:3},
  "Kalcer Radomlje":   {played:3, wins:0, draws:1, losses:2, goalsFor:3, goalsAgainst:6},
  "Koper":             {played:3, wins:1, draws:2, losses:0, goalsFor:5, goalsAgainst:3},
  "Maribor":           {played:3, wins:1, draws:2, losses:0, goalsFor:4, goalsAgainst:1},
  "Mura":              {played:3, wins:1, draws:1, losses:1, goalsFor:5, goalsAgainst:7},
  "Nafta 1903":        {played:3, wins:2, draws:0, losses:1, goalsFor:8, goalsAgainst:4},
  "Olimpija":          {played:3, wins:1, draws:0, losses:2, goalsFor:1, goalsAgainst:3},
};

function prazenSeznamKlubov(){
  return KLUBI_26_27.map((name, i) => ({
    position: i + 1,
    name,
    played: 0, wins: 0, draws: 0, losses: 0,
    goalsFor: 0, goalsAgainst: 0, diff: 0, points: 0,
    isMaribor: name === "Maribor",
  }));
}

function izracunajLestvico(){
  const sezonaSeZacela = Object.values(LESTVICA_PODATKI).some(t => t.played > 0);

  let teams = Object.entries(LESTVICA_PODATKI).map(([name, s]) => ({
    name,
    played: s.played,
    wins: s.wins,
    draws: s.draws,
    losses: s.losses,
    goalsFor: s.goalsFor,
    goalsAgainst: s.goalsAgainst,
    diff: s.goalsFor - s.goalsAgainst,
    points: s.wins * 3 + s.draws,
    isMaribor: name === "Maribor",
  }));

  if(sezonaSeZacela){
    // razvrstitev: točke, nato gol razlika, nato doseženi goli
    teams.sort((a,b) => b.points - a.points || b.diff - a.diff || b.goalsFor - a.goalsFor || a.name.localeCompare(b.name, 'sl'));
  } else {
    // dokler sezona ne steče, razvrstimo po abecedi
    teams.sort((a,b) => a.name.localeCompare(b.name, 'sl'));
  }
  teams = teams.map((t, i) => ({...t, position: i + 1}));

  return { teams, sezonaSeZacela };
}

function conaZaPozicijo(position, steviloKlubov){
  if(position === 1) return {key:'cl', label:'Liga prvakov'};
  if(position === 2 || position === 3) return {key:'conf', label:'Konferenčna liga'};
  if(position === steviloKlubov - 1) return {key:'warn', label:'Kvalifikacije za obstanek'};
  if(position === steviloKlubov) return {key:'out', label:'Izpad'};
  return null;
}

function nalozLestvico(){
  const contentEl = document.getElementById('lestvicaContent');
  const updatedEl = document.getElementById('lestvicaUpdated');

  const { teams, sezonaSeZacela } = izracunajLestvico();

  const steviloKlubov = teams.length;
  let rows = teams.map(t => {
    const cona = conaZaPozicijo(t.position, steviloKlubov);
    const zoneClass = cona ? `zone-${cona.key}` : '';
    const cls = [t.isMaribor ? 'maribor-row' : '', zoneClass].filter(Boolean).join(' ');
    return `
    <tr class="${cls}">
      <td class="pos"><span class="pos-badge">${t.position}</span></td>
      <td class="name-col">${t.name}</td>
      <td>${t.played}</td>
      <td>${t.wins}</td>
      <td>${t.draws}</td>
      <td>${t.losses}</td>
      <td>${t.goalsFor}:${t.goalsAgainst}</td>
      <td>${t.diff > 0 ? '+' : ''}${t.diff}</td>
      <td class="points"><span class="points-pill">${t.points}</span></td>
    </tr>
  `;
  }).join('');

  contentEl.outerHTML = `
    <div style="overflow-x:auto;">
      ${!sezonaSeZacela ? '<div class="lestvica-note" style="padding:8px 14px;text-align:left;">Sezona se še ni začela — klubi so razvrščeni po abecedi.</div>' : ''}
      <table class="lestvica" id="lestvicaContent">
        <thead>
          <tr>
            <th></th>
            <th class="name-col">Klub</th>
            <th title="Odigrane">T</th>
            <th title="Zmage">Z</th>
          <th title="Neodločeno">N</th>
          <th title="Porazi">P</th>
          <th title="Goli">D:P</th>
          <th title="Gol razlika">+/-</th>
          <th title="Točke">T</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="lestvica-legend">
        <span><span class="legend-dot" style="background:var(--liga-prvakov);"></span> Liga prvakov</span>
        <span><span class="legend-dot" style="background:var(--konferencna);"></span> Konferenčna liga</span>
        <span><span class="legend-dot" style="background:var(--kvalifikacije);"></span> Kvalifikacije za obstanek</span>
        <span><span class="legend-dot" style="background:var(--derby);"></span> Izpad</span>
      </div>
  </div>`;

  if(updatedEl){
    updatedEl.textContent = "";
  }
}

nalozLestvico();

/* ===== GLASBENA PODLAGA ===== */
const bgMusic = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicToggle');

musicBtn.addEventListener('click', () => {
  if(bgMusic.paused){
    bgMusic.volume = 0.5;
    bgMusic.play().catch(err => {
      console.warn('Predvajanje ni uspelo:', err);
      alert('Datoteke audio/himna.mp3 ni bilo mogoče predvajati. Preveri, ali je naložena v repo.');
    });
    musicBtn.classList.add('playing');
  } else {
    bgMusic.pause();
    musicBtn.classList.remove('playing');
  }
});
</script>
</body>

  *{box-sizing:border-box;}
  body{
    margin:0;
    overflow-anchor:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #7b2fb522 0%, transparent 45%),
      radial-gradient(circle at 100% 10%, #f5c51822 0%, transparent 40%),

    color:var(--text);
    padding:20px;
    position:relative;
    overflow-x:hidden;
  }
  body::before, body::after{
    content:"";
    position:fixed;
    width:520px;height:520px;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.16;
    z-index:-1;
    pointer-events:none;
  }
  body::before{
    top:-180px; left:-160px;
    background:radial-gradient(circle, var(--vijola-2), transparent 70%);
    animation:blobFloat1 16s ease-in-out infinite;
  }
  body::after{
    bottom:-200px; right:-160px;
    background:radial-gradient(circle, var(--zlata), transparent 70%);
    animation:blobFloat2 20s ease-in-out infinite;
  }
  @keyframes blobFloat1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(40px,60px) scale(1.15); }
  }
  @keyframes blobFloat2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-50px,-40px) scale(1.2); }
  }
  #introScreen{
    position:fixed;
    inset:0;
    z-index:1000;

    100%{ opacity:0; visibility:hidden; pointer-events:none; transform:scale(1.15); filter:blur(14px); }

  .gol-zoga:nth-of-type(3){ animation-delay:.4s; }
  .gol-zoga:nth-of-type(4){ animation-delay:.6s; }
  .gol-zoga:nth-of-type(5){ animation-delay:.8s; }
  .lestvica-strelec{

  }
  .strelci-panel.open .strelci-col > div:nth-child(2){animation-delay:.15s;}
  .strelci-panel.open .strelci-col > div:nth-child(3){animation-delay:.25s;}
  .strelci-panel.open .strelci-col > div:nth-child(4){animation-delay:.35s;}
  @keyframes strelciRowIn{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .strelci-content strong{color:var(--vijola-2);}
  .strelec-mb{
    color:var(--vijola-2);
    font-weight:800;
    display:block;
    animation:strelecPulse 2s ease-in-out infinite;
  }
  @keyframes strelecPulse{
    0%,100%{ text-shadow:0 0 0 rgba(123,47,181,0); }
    50%{ text-shadow:0 0 8px rgba(123,47,181,0.6); }
  }
  .match.visible{
    animation:matchFadeIn .55s cubic-bezier(.21,.86,.4,1) forwards;
  }
  @keyframes matchFadeIn{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .match:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(46,15,77,0.16);
  }
  .match.next-up{
    animation:matchFadeIn .55s cubic-bezier(.21,.86,.4,1) forwards, nextUpPulse 2.2s ease-in-out .55s infinite;
  }
  @keyframes nextUpPulse{
    0%,100%{ box-shadow:0 2px 6px rgba(46,15,77,0.08), 0 0 0 rgba(245,197,24,0.5); }
    50%{ box-shadow:0 4px 14px rgba(46,15,77,0.14), 0 0 14px rgba(245,197,24,0.6); }
  }
  .match.away{border-left-color:#d8c8ee;}
  .match.derby{
    border-left-color:var(--derby);
    background:linear-gradient(90deg,#fff 0%, #fff6f2 100%);
    box-shadow:0 3px 10px rgba(232,51,46,0.15);

  .krog{
    font-size:11px;
    color:#fff;
    width:56px;
    flex-shrink:0;
    text-align:center;
    font-weight:800;
    background:var(--vijola);
    border-radius:8px;
    padding:6px 4px;
    transition:transform .25s ease, background-color .25s ease;
  }
  .match:hover .krog{
    transform:scale(1.08) rotate(-2deg);
    background:var(--vijola-2);
  }
  .datum{
    width:150px;
    flex-shrink:0;
    font-size:13px;
    font-weight:700;
    color:var(--vijola-dark);
  }
  .datum .dan{
    display:block;
    font-size:11px;
    font-weight:400;
    color:var(--muted);
    text-transform:capitalize;
  }
  .tekma{
    flex:1;
    font-size:15px;
    font-weight:800;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    min-width:0;
  }
  .tekma-glavno{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:6px;
    width:100%;
  }
  .tekma-glavno > *:first-child{ text-align:right; }
  .tekma-glavno > *:last-child{ text-align:left; }
  .rezultat{
    display:inline-block;
    background:var(--vijola);
    color:#fff;
    font-weight:900;
    font-size:13.5px;
    padding:2px 6px;
    width:44px;
    text-align:center;
    border-radius:8px;
    margin:0 4px;
    cursor:pointer;
    transition:transform .15s ease;
    animation:pillPop .3s ease backwards, rezultatGlow 2.4s ease-in-out .3s infinite;
  }
  .rezultat:hover{ transform:scale(1.1); }
  .rezultat:active{ transform:scale(0.95); }
  @keyframes rezultatGlow{
    0%,100%{ box-shadow:0 0 0 rgba(245,197,24,0); }
    50%{ box-shadow:0 0 10px rgba(245,197,24,0.65); }
  }
  .match.played{
    border-left-color:var(--vijola-2);
  }
  .match.played .badge{
    opacity:0.65;
  }
  .match.played .krog,
  .match.played .datum,
  .match.played .venue,
  .match.played .tekma-glavno .tim,
  .match.played .tekma-glavno .maribor{
    opacity:0.6;
  }
  .tekma .maribor{color:var(--vijola-2);position:relative;display:inline-block;}
  .tekma .tim{white-space:nowrap;}
  .tekma .maribor::after{
    content:"";
    position:absolute;left:0;right:0;bottom:-2px;height:3px;
    border-radius:2px;
    background:linear-gradient(90deg, var(--zlata) 0%, #fff2b8 50%, var(--zlata) 100%);
    background-size:220% auto;
    animation:mariborUnderline 3s linear infinite;
  }
  @keyframes mariborUnderline{
    0%{ background-position:0% 0; }
    100%{ background-position:-220% 0; }
  }
  .venue{
    font-size:12px;
    color:var(--muted);
    text-align:right;
    width:170px;
    flex-shrink:0;
  }
  .match.home .venue{
    color:var(--vijola-2);
    font-weight:800;
  }
  .badge{
    display:inline-block;
    font-size:10px;
    font-weight:800;
    padding:3px 9px;
    border-radius:20px;
    margin-left:8px;
    vertical-align:middle;
    letter-spacing:0.3px;
    box-shadow:0 2px 5px rgba(0,0,0,0.12);
  }
  .badge.h{background:var(--zlata);color:#4a3800;position:relative;}
  .badge.h::after{
    content:"";
    position:absolute; inset:-8px -12px;
    background-image:
      radial-gradient(circle, var(--zlata) 2px, transparent 2.5px),
      radial-gradient(circle, var(--vijola-2) 2px, transparent 2.5px),
      radial-gradient(circle, var(--derby) 1.6px, transparent 2px),
      radial-gradient(circle, var(--vijola) 1.6px, transparent 2px);
    background-position:0 20%, 100% 10%, 25% 100%, 75% 90%;
    background-repeat:no-repeat;
    opacity:0;
    pointer-events:none;
  }
  .match.home:hover .badge.h::after{
    animation:confettiBurst .65s ease-out;
  }
  @keyframes confettiBurst{
    0%{ opacity:1; transform:scale(0.3) translateY(0) rotate(0deg); }
    100%{ opacity:0; transform:scale(1.4) translateY(-16px) rotate(35deg); }
  }
  .badge.a{background:#ede4fa;color:var(--vijola);}
  .badge.derby{background:var(--derby);color:#fff;animation:derbyPulse 1.6s ease-in-out infinite;}
  @keyframes derbyPulse{
    0%,100%{ box-shadow:0 0 0 rgba(232,51,46,0.5); }
    50%{ box-shadow:0 0 10px rgba(232,51,46,0.75); }
  }

  footer{
    margin-top:34px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
    line-height:1.7;
    padding-bottom:10px;
  }
  footer .foot-crest{
    opacity:0.6;
    margin-bottom:8px;
    display:inline-block;
    animation:footCrestFloat 3s ease-in-out infinite;
  }
  @keyframes footCrestFloat{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-4px) rotate(6deg); }
  }

  /* ===== COUNTDOWN ===== */
  /* ===== TOP ROW: odštevalnik (levo) + lestvica (desno) ===== */
  .top-row{
    display:flex;
    gap:18px;
    align-items:stretch;
    margin-bottom:22px;
  }
  .top-row .countdown{
    flex:0 0 260px;
    aspect-ratio:9/16;
    align-self:flex-start;
    min-width:0;
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    animation:slideInLeft .6s .15s cubic-bezier(.21,.86,.4,1) both, countdownGlow 3s ease-in-out .75s infinite;
  }
  .top-row .table-wrap{
    flex:1;
    min-width:0;
    height:462px;
    margin-bottom:0;
    display:flex;
    flex-direction:column;
    animation:slideInRight .6s .25s cubic-bezier(.21,.86,.4,1) both;
  }
  .top-row .lestvica-scroll-wrap{
    overflow-y:auto;
    flex:1;
    min-height:0;
    scrollbar-width:thin;
    scrollbar-color:var(--zlata) transparent;
  }
  .top-row .lestvica-scroll-wrap::-webkit-scrollbar{
    width:8px;
  }
  .top-row .lestvica-scroll-wrap::-webkit-scrollbar-track{
    background:transparent;
  }
  .top-row .lestvica-scroll-wrap::-webkit-scrollbar-thumb{
    background:linear-gradient(var(--zlata), var(--vijola-2));
    border-radius:8px;
  }
  .top-row .lestvica-scroll-wrap::-webkit-scrollbar-thumb:hover{
    background:var(--zlata);
  }
  @keyframes slideInLeft{
    0%{ opacity:0; transform:translateX(-24px); }
    100%{ opacity:1; transform:translateX(0); }
  }
  @keyframes slideInRight{
    0%{ opacity:0; transform:translateX(24px); }
    100%{ opacity:1; transform:translateX(0); }
  }
  .top-row .table-wrap > div:last-child{
    flex:1;
  }
  @media(max-width:800px){
    .top-row{flex-direction:column; align-items:center;}
    .top-row .countdown{flex:none; width:min(260px, 70vw);}
    .top-row .table-wrap{width:100%;}
  }

  .countdown{
    background:linear-gradient(150deg, var(--vijola-dark) 0%, var(--vijola) 100%);
    border:2px solid var(--zlata);
    border-radius:18px;
    padding:20px 24px;
    margin-bottom:26px;
    color:#fff;
    text-align:center;
    box-shadow:0 10px 26px rgba(46,15,77,0.3);
    position:relative;
    overflow:hidden;
  }
  .countdown-bg-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 35%;
    transform:scale(1.25);
    z-index:0;
  }
  .countdown::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(46,15,77,0.55) 0%, rgba(46,15,77,0.3) 35%, rgba(46,15,77,0.35) 65%, rgba(46,15,77,0.65) 100%);
    z-index:1;
    pointer-events:none;
  }
  .countdown > *:not(.countdown-bg-img){
    position:relative;
    z-index:2;
  }
  @keyframes countdownGlow{
    0%,100%{ box-shadow:0 10px 26px rgba(46,15,77,0.3), 0 0 0 rgba(245,197,24,0); }
    50%{ box-shadow:0 10px 30px rgba(46,15,77,0.35), 0 0 24px rgba(245,197,24,0.35); }
  }
  .countdown .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--zlata);
    font-weight:800;
    margin-bottom:8px;
  }
  .countdown .next-match{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:16px;
  }
  .countdown .match-title{
    font-size:28px;
    font-weight:900;
    letter-spacing:0.2px;
    white-space:nowrap;
    display:inline-block;
    max-width:100%;
    text-shadow:0 2px 12px rgba(0,0,0,0.95), 0 0 24px rgba(0,0,0,0.7);
    animation:nextMatchPop .7s cubic-bezier(.34,1.56,.64,1) both, venueBreathe 4s ease-in-out 1s infinite;
  }
  .countdown .kickoff-line{
    margin-top:8px;
    font-size:17px;
    padding:0 6px;
    animation:nextMatchPop .6s cubic-bezier(.34,1.56,.64,1) .15s both, venueBreathe 4s ease-in-out 1s infinite;
  }
  @keyframes nextMatchPop{
    0%{ opacity:0; transform:scale(0.85) translateY(8px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  @keyframes textFlicker{
    0%,100%{ text-shadow:0 2px 10px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.5); }
    50%{ text-shadow:0 2px 10px rgba(0,0,0,0.85), 0 0 14px rgba(245,197,24,0.4); }
  }
  .countdown .next-match .maribor{color:var(--zlata);}
  .countdown .venue-mini{
    font-size:14px;
    font-weight:700;
    display:block;
    margin-top:6px;
    text-shadow:0 2px 10px rgba(0,0,0,0.95);
    opacity:0;
    animation:nextMatchPop .6s cubic-bezier(.34,1.56,.64,1) .3s forwards, venueBreathe 4s ease-in-out 1s infinite;
  }
  @keyframes venueBreathe{
    0%,100%{ opacity:1; text-shadow:0 2px 8px rgba(0,0,0,0.85); }
    50%{ opacity:0.4; text-shadow:0 2px 8px rgba(0,0,0,0.85), 0 0 16px rgba(245,197,24,0.9), 0 0 30px rgba(245,197,24,0.45); }
  }
  .countdown .kickoff-time{
    opacity:1;
    font-weight:700;
  }
  .countdown .kickoff-time.confirmed{ color:var(--zlata); }
  .countdown .kickoff-time.tentative{ color:#e7d7fa; font-weight:400; font-style:italic; }
  .timer{
    display:flex;
    justify-content:center;
    gap:5px;
    flex-wrap:nowrap;
    margin-top:10px;
  }
  .timer .unit{
    background:rgba(20,8,35,0.55);
    border:1px solid rgba(245,197,24,0.5);
    border-radius:10px;
    padding:10px 4px;
    min-width:0;
    flex:1;
    transition:transform .2s ease, background-color .2s ease;
  }
  .timer .unit:hover{
    transform:translateY(-3px) scale(1.05);
    background:rgba(245,197,24,0.18);
  }
  .timer .num{
    font-size:23px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    color:var(--zlata);
    line-height:1;
    text-shadow:0 2px 10px rgba(0,0,0,0.95);
    animation:numGlow 2.4s ease-in-out infinite, venueBreathe 4s ease-in-out 1s infinite;
  }
  @keyframes numGlow{
    0%,100%{ text-shadow:0 2px 10px rgba(0,0,0,0.95); }
    50%{ text-shadow:0 2px 10px rgba(0,0,0,0.95), 0 0 14px rgba(245,197,24,0.7); }
  }
  @keyframes numPop{
    0%{ transform:scale(1.35); opacity:0.5; }
    100%{ transform:scale(1); opacity:1; }
  }
  .timer .num.pop{
    animation:numPop 0.35s ease-out;
  }
  .timer .unit-label{
    font-size:8px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    text-shadow:0 1px 4px rgba(0,0,0,0.8);
    margin-top:2px;
    animation:venueBreathe 4s ease-in-out 1s infinite;
  }
  .countdown .note{
    font-size:11px;
    opacity:0.6;
    margin-top:14px;
  }

  /* ===== LESTVICA ===== */
  .table-wrap{
    background:var(--card);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 14px 34px rgba(46,15,77,0.32), 0 4px 10px rgba(46,15,77,0.18);
    margin-bottom:22px;
    border:none;
  }
  .lestvica-brez-naslova{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    padding:2px;
    background:linear-gradient(135deg, var(--zlata) 0%, var(--vijola-2) 45%, var(--vijola-dark) 75%, var(--zlata) 100%);
  }
  .lestvica-brez-naslova::before{
    content:"";
    position:absolute;
    inset:-50%;
    background:conic-gradient(from 0deg, transparent 0deg, transparent 320deg, var(--zlata) 350deg, #fff8dd 358deg, var(--zlata) 360deg);
    animation:krogecSvetloba 7s linear infinite;
    opacity:0.85;
  }
  @keyframes krogecSvetloba{
    to{ transform:rotate(360deg); }
  }
  .lestvica-glow-inner{
    position:relative;
    z-index:1;
    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .table-header{
    background:linear-gradient(90deg,var(--vijola),var(--vijola-2),var(--vijola));
    background-size:200% 100%;
    animation:tableHeaderSheen 6s ease-in-out infinite;
    color:#fff;
    padding:12px 16px;
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  @keyframes tableHeaderSheen{
    0%,100%{ background-position:0% 0; }
    50%{ background-position:100% 0; }
  }
  .table-header .updated{
    font-size:10.5px;
    font-weight:400;
    text-transform:none;
    letter-spacing:0;
    opacity:0.8;
  }
  table.lestvica{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  table.lestvica th{
    text-align:center;
    padding:8px 4px;
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.6px;
    font-weight:700;
    border-bottom:2px solid #ece3fa;
  }
  table.lestvica th.name-col, table.lestvica td.name-col{
    text-align:left;
    padding-left:14px;
  }
  table.lestvica td.name-col{
    color:#000;
    font-weight:700;
  }
  table.lestvica td{
    text-align:center;
    padding:8px 4px;
    border-bottom:1px solid #f2ecfa;
  }
  table.lestvica tr:last-child td{border-bottom:none;}
  table.lestvica tbody tr{
    opacity:0;
    animation:rowFadeIn .35s ease forwards;
    transition:background-color .15s ease;
  }
  table.lestvica tbody tr:hover{ background:#f3ecff; }
  table.lestvica tbody tr:nth-child(even){ background:#f6f1fd; }
  @keyframes rowFadeIn{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  table.lestvica tbody tr:nth-child(1){animation-delay:.02s;}
  table.lestvica tbody tr:nth-child(2){animation-delay:.05s;}
  table.lestvica tbody tr:nth-child(3){animation-delay:.08s;}
  table.lestvica tbody tr:nth-child(4){animation-delay:.11s;}
  table.lestvica tbody tr:nth-child(5){animation-delay:.14s;}
  table.lestvica tbody tr:nth-child(6){animation-delay:.17s;}
  table.lestvica tbody tr:nth-child(7){animation-delay:.20s;}
  table.lestvica tbody tr:nth-child(8){animation-delay:.23s;}
  table.lestvica tbody tr:nth-child(9){animation-delay:.26s;}
  table.lestvica tbody tr:nth-child(10){animation-delay:.29s;}

  table.lestvica td.pos{
    width:28px;
    padding:10px 2px;
    display:flex;
    align-items:center;
    gap:5px;
    justify-content:center;
  }
  .pos-badge{
    display:inline-flex;
    align-items:center;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(650, ctx.currentTime + 0.12);

function izracunajStrelceMaribora(){
  const goli = {}; // ime -> število golov
  fixtures.forEach(f => {
    const krog = f[0], dom = f[2], gost = f[3];
    const podatki = STRELCI[krog];
    if(!podatki) return;
    const mariborStran = dom === "Maribor" ? podatki.dom : (gost === "Maribor" ? podatki.gost : null);
    if(!mariborStran) return;
    mariborStran.forEach(vnos => {
      const ime = vnos.replace(/\s*\d.*$/, '').trim();
      const steviloGolov = (vnos.match(/\d+'/g) || []).length || 1;
      goli[ime] = (goli[ime] || 0) + steviloGolov;
    });
  });
  return Object.entries(goli).sort((a,b) => b[1]-a[1]);
}

    const priimek = deli.pop();
    const ime = deli.join(' ');
    return ime ? `${ime} <span class="kader-priimek">${priimek}</span>` : `<span class="kader-priimek">${priimek}</span>`;
  };

  const skupine = Object.entries(KADER).map(([pozicija, igralci]) => {
    const vrstice = igralci.map(ig => {
      const st = golovMap[ig.ime] || 0;
      let zogice = '';
      if(st > 0 && st <= MEJA_ZOGIC){
        zogice = '<span class="gol-zoga"></span>'.repeat(st);
      } else if(st > MEJA_ZOGIC){
        zogice = `<span class="gol-zoga-stevilo">×${st}</span>`;
      }
      return `<div class="kader-igralec-mini"><span class="kader-st-mini">${ig.st}</span> ${razdeliIme(ig.ime)} ${zogice}</div>`;
    }).join('');
    return `
      <div class="lestvica-kader-skupina">
        <div class="lestvica-kader-naslov">${pozicija}</div>
        <div class="lestvica-kader-seznam">${vrstice}</div>
      </div>
    `;
  }).join('');

  return skupine;
}

const dnevi = ["nedelja","ponedeljek","torek","sreda","četrtek","petek","sobota"];
const meseci = ["jan","feb","mar","apr","maj","jun","jul","avg","sep","okt","nov","dec"];

function formatDate(iso){
  const d = new Date(iso+"T12:00:00");
  const dan = dnevi[d.getDay()];
  const dd = d.getDate();
  const mes = meseci[d.getMonth()];
  return {dan, label: `${dd}. ${mes} ${d.getFullYear()}`};
}

const container = document.getElementById('fixtures');
let currentHalf = null;

/* ROČNO VNESENI REZULTATI ODIGRANIH TEKEM
   Ko je tekma odigrana, se tu doda: krog: "goli_doma:goli_gostov" */
const REZULTATI = {
  1: "0:0",
  2: "3:0",
  3: "1:1",
  4: "2:0",
  5: "1:1",
};

/* STRELCI ZADETKOV - ko je znano, kdo je zabil, dodaj sem: krog: "besedilo s strelci"
   Primer: 2: "Kramarič 23', Rajčević 67', Šporn 89'" */
const STRELCI = {
  1: { dom: [], gost: [] },
  2: { dom: ["Bradley M'bondo 13'", "Isaac Tshipamba 78'", "Tio Cipot 83'"], gost: [] },
  3: { dom: ["Darko Hrka 79'"], gost: ["Žiga Repas 3'"] },
  4: { dom: ["Žiga Repas 10'", "Isaac Tshipamba 65'"], gost: [] },
  5: { dom: ["Jošt Urbančič 45'+7"], gost: ["Luka Zahović 85'"] },
};

fixtures.forEach(f => {
  const [krog, datum, dom, gost, prizorisce, homeMatch, derby] = f;
  const isDerby = derby === "derby";

  const half = krog <= 18 ? "Jesenski del · 1.–18. krog" : "Spomladanski del · 19.–36. krog";
  if(half !== currentHalf){
    currentHalf = half;
    const h = document.createElement('div');
    h.className = 'polsezon';
    h.textContent = half;
    container.appendChild(h);
  }

  const {dan, label} = formatDate(datum);
  const ura = POTRJENE_URE[krog];
  const rezultat = REZULTATI[krog];

  const row = document.createElement('div');
  row.className = 'match ' + (homeMatch ? 'home' : 'away') + (isDerby ? ' derby' : '') + (rezultat ? ' played' : '');

  const domHtml = dom === "Maribor" ? '<span class="maribor">Maribor</span>' : `<span class="tim">${dom}</span>`;
  const gostHtml = gost === "Maribor" ? '<span class="maribor">Maribor</span>' : `<span class="tim">${gost}</span>`;

  const strelciPodatki = STRELCI[krog] || {dom:[], gost:[]};
  const izrisiStrelce = (seznam, imeKluba) => {
    if(!seznam || seznam.length === 0) return '<div class="strelci-prazno">—</div>';
    return seznam.map(s => {
      const jeMB = imeKluba === "Maribor";
      return `<div class="${jeMB ? 'strelec-mb' : ''}">${s}</div>`;
    }).join('');
  };

  row.innerHTML = `
    <div class="match-row">
      <div class="krog">${krog}. krog</div>
      <div class="datum">${label}<span class="dan">${rezultat ? 'Končano' : (ura ? dan + ' · ' + ura : '')}</span></div>
      <div class="tekma">
        <span class="tekma-glavno">${domHtml} ${rezultat ? `<span class="rezultat" data-krog="${krog}">${rezultat}</span>` : '—'} ${gostHtml}</span>
        ${isDerby ? '<span class="badge derby">VEČNI DERBI</span>' : (rezultat ? '' : (homeMatch ? '<span class="badge h">DOMA</span>' : '<span class="badge a">V GOSTEH</span>'))}
      </div>
      <div class="venue">${prizorisce}</div>
    </div>
    ${rezultat ? `<div class="strelci-panel" id="strelci-${krog}">
      <div class="strelci-grid">
        <div class="strelci-col">
          <div class="strelci-col-label">${dom}</div>
          ${izrisiStrelce(strelciPodatki.dom, dom)}
        </div>
        <div class="strelci-col">
          <div class="strelci-col-label">${gost}</div>
          ${izrisiStrelce(strelciPodatki.gost, gost)}
        </div>
      </div>
    </div>` : ''}
  `;
  row.id = `match-${krog}`;
  const ovoj = document.createElement('div');
  ovoj.className = 'match-svetli-ovoj';
  ovoj.id = `match-wrap-${krog}`;
  ovoj.appendChild(row);
  container.appendChild(ovoj);
});

// Postopno pojavljanje vrstic razporeda pri skrolanju navzdol
const fadeObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry, i) => {
    if(entry.isIntersecting){
      setTimeout(() => entry.target.classList.add('visible'), i * 30);
      fadeObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.1, rootMargin: "0px 0px -40px 0px" });

document.querySelectorAll('.match, .polsezon').forEach(el => fadeObserver.observe(el));

/* ===== ODŠTEVALNIK DO NASLEDNJE TEKME ===== */
/* Ker uradne ure tekem še niso objavljene, uporabljamo oceno 18:00 (lokalni čas, Europe/Ljubljana). */
const ASSUMED_KICKOFF = "18:00:00";

function getNextFixture(){
  const now = new Date();
  for(const f of fixtures){
    const [krog, datum, dom, gost] = f;
    const uraTekme = POTRJENE_URE[krog] ? POTRJENE_URE[krog] + ":00" : ASSUMED_KICKOFF;
    const kickoff = new Date(`${datum}T${uraTekme}`);
    if(kickoff.getTime() > now.getTime()){
      return {
        krog, datum, dom, gost, kickoff, prizorisce: f[4], derby: f[5] === "derby",
        ura: POTRJENE_URE[krog] || null,
        uraPotrjena: !!POTRJENE_URE[krog]
      };
    }
  }
  return null;
}

function pad(n){ return String(n).padStart(2,"0"); }

let zadnjiPrikazaniKrog = null;

function updateCountdown(){
  const next = getNextFixture();
  const labelEl = document.getElementById('nextMatchLabel');
  const noteEl = document.getElementById('countdownNote');

  if(!next){
    if(zadnjiPrikazaniKrog !== 'konec'){
      labelEl.innerHTML = "Sezona 2026/27 je zaključena 🏁";
      zadnjiPrikazaniKrog = 'konec';
    }
    document.getElementById('cd-days').textContent = "00";
    document.getElementById('cd-hours').textContent = "00";
    document.getElementById('cd-mins').textContent = "00";
    document.getElementById('cd-secs').textContent = "00";
    return;
  }

  if(zadnjiPrikazaniKrog !== next.krog){
    const domHtml = next.dom === "Maribor" ? '<span class="maribor">Maribor</span>' : next.dom;
    const gostHtml = next.gost === "Maribor" ? '<span class="maribor">Maribor</span>' : next.gost;
    const uraPrikaz = next.ura || ASSUMED_KICKOFF.slice(0,5);
    const {dan, label} = formatDate(next.datum);
    const labelBrezLeta = label.replace(/\s\d{4}$/, '');
    const uraHtml = next.uraPotrjena
      ? `<span class="kickoff-time confirmed">${dan}, ${labelBrezLeta} · ${uraPrikaz}</span>`
      : `<span class="kickoff-time tentative">${dan}, ${labelBrezLeta} · predvidoma ${uraPrikaz}</span>`;
    labelEl.innerHTML = `<span class="match-title">${domHtml} — ${gostHtml}${next.derby ? ' ⚡' : ''}</span>
      <span class="kickoff-line">${uraHtml}</span>
      <span class="venue-mini">${next.prizorisce}</span>`;
    zadnjiPrikazaniKrog = next.krog;
    requestAnimationFrame(() => {
      const naslovEl = labelEl.querySelector('.match-title');
      if(naslovEl){
        let velikost = 25;
        naslovEl.style.fontSize = velikost + 'px';
        while(naslovEl.scrollWidth > naslovEl.parentElement.clientWidth && velikost > 12){
          velikost -= 1;
          naslovEl.style.fontSize = velikost + 'px';
        }
      }
    });
  }

  const diff = next.kickoff.getTime() - Date.now();
  const totalSec = Math.max(0, Math.floor(diff / 1000));
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;

  document.getElementById('cd-days').textContent = pad(days);
  document.getElementById('cd-hours').textContent = pad(hours);
  document.getElementById('cd-mins').textContent = pad(mins);
  const secEl = document.getElementById('cd-secs');
  secEl.textContent = pad(secs);
  secEl.classList.remove('pop');
  void secEl.offsetWidth; // reflow, da se animacija lahko ponovno sproži
  secEl.classList.add('pop');
}

// Osvetlitev naslednje tekme v razporedu - nastavimo SAMO ENKRAT, ne vsako sekundo,
// da preprečimo morebitno "scroll anchoring" obnašanje brskalnika med skrolanjem.
function highlightNextMatch(){
  const next = getNextFixture();
  document.querySelectorAll('.match').forEach(el => el.classList.remove('next-up'));
  document.querySelectorAll('.match-svetli-ovoj').forEach(el => el.classList.remove('svetlobni-rob'));
  if(next){
    const rowEl = document.getElementById(`match-${next.krog}`);
    if(rowEl){ rowEl.classList.add('next-up'); }
    const ovojEl = document.getElementById(`match-wrap-${next.krog}`);
    if(ovojEl){ ovojEl.classList.add('svetlobni-rob'); }
  }
}
highlightNextMatch();
// osvežimo osvetlitev le enkrat na minuto (dovolj pogosto, brez tveganja za skrolanje)
setInterval(highlightNextMatch, 60000);

updateCountdown();
setInterval(updateCountdown, 1000);

/* ===== LESTVICA ===== */

const KLUBI_26_27 = [
  "Aluminij", "Bravo", "Brinje-Grosuplje", "Celje", "Kalcer Radomlje",
  "Koper", "Maribor", "Mura", "Nafta 1903", "Olimpija"
].sort((a,b) => a.localeCompare(b, 'sl'));

/* ROČNO POSODABLJANA LESTVICA
   Po vsakem odigranem krogu se tu posodobijo številke za posamezen klub.
   played = odigrane, wins = zmage, draws = neodločeno, losses = porazi,
   goalsFor = doseženi goli, goalsAgainst = prejeti goli.
   Zadnja posodobitev: pred 1. krogom (vsi na 0). */
/* UVRSTITEV PO PREJŠNJEM KROGU (za prikaz gibanja - rumen/rdeč/zelen krogec)
   Po vsaki posodobitvi lestvice se to prepiše na TRENUTNO uvrstitev pred novo posodobitvijo. */
const PREJSNJA_POZICIJA = {
  "Maribor": 1,
  "Nafta 1903": 2,
  "Bravo": 3,
  "Celje": 4,
  "Koper": 5,
  "Brinje-Grosuplje": 6,
  "Kalcer Radomlje": 7,
  "Mura": 8,
  "Olimpija": 9,
  "Aluminij": 10,
};

const LESTVICA_PODATKI = {
  "Aluminij":          {played:4, wins:1, draws:2, losses:1, goalsFor:4, goalsAgainst:3},
  "Bravo":             {played:5, wins:2, draws:2, losses:1, goalsFor:5, goalsAgainst:5},
  "Brinje-Grosuplje":  {played:5, wins:1, draws:2, losses:2, goalsFor:5, goalsAgainst:7},
  "Celje":             {played:4, wins:2, draws:2, losses:0, goalsFor:7, goalsAgainst:4},
  "Kalcer Radomlje":   {played:5, wins:1, draws:1, losses:3, goalsFor:7, goalsAgainst:10},
  "Koper":             {played:5, wins:1, draws:3, losses:1, goalsFor:5, goalsAgainst:5},
  "Maribor":           {played:5, wins:2, draws:3, losses:0, goalsFor:7, goalsAgainst:2},
  "Mura":              {played:5, wins:2, draws:1, losses:2, goalsFor:8, goalsAgainst:11},
  "Nafta 1903":        {played:5, wins:2, draws:1, losses:2, goalsFor:10, goalsAgainst:8},
  "Olimpija":          {played:5, wins:1, draws:1, losses:3, goalsFor:2, goalsAgainst:5},
};

function prazenSeznamKlubov(){
  return KLUBI_26_27.map((name, i) => ({
    position: i + 1,
    name,
    played: 0, wins: 0, draws: 0, losses: 0,
    goalsFor: 0, goalsAgainst: 0, diff: 0, points: 0,
    isMaribor: name === "Maribor",
  }));
}

function izracunajLestvico(){
  const sezonaSeZacela = Object.values(LESTVICA_PODATKI).some(t => t.played > 0);

  let teams = Object.entries(LESTVICA_PODATKI).map(([name, s]) => ({
    name,
    played: s.played,
    wins: s.wins,
    draws: s.draws,
    losses: s.losses,
    goalsFor: s.goalsFor,
    goalsAgainst: s.goalsAgainst,
    diff: s.goalsFor - s.goalsAgainst,
    points: s.wins * 3 + s.draws,
    isMaribor: name === "Maribor",
  }));

  if(sezonaSeZacela){
    // razvrstitev: točke, nato gol razlika, nato doseženi goli
    teams.sort((a,b) => b.points - a.points || b.diff - a.diff || b.goalsFor - a.goalsFor || a.name.localeCompare(b.name, 'sl'));
  } else {
    // dokler sezona ne steče, razvrstimo po abecedi
    teams.sort((a,b) => a.name.localeCompare(b.name, 'sl'));
  }
  teams = teams.map((t, i) => ({...t, position: i + 1}));

  return { teams, sezonaSeZacela };
}

function conaZaPozicijo(position, steviloKlubov){
  if(position === 1) return {key:'cl', label:'Liga prvakov'};
  if(position === 2 || position === 3) return {key:'conf', label:'Konferenčna liga'};
  if(position === steviloKlubov - 1) return {key:'warn', label:'Kvalifikacije za obstanek'};
  if(position === steviloKlubov) return {key:'out', label:'Izpad'};
  return null;
}

function nalozLestvico(){
  const contentEl = document.getElementById('lestvicaContent');
  const updatedEl = document.getElementById('lestvicaUpdated');

  const { teams, sezonaSeZacela } = izracunajLestvico();

  const steviloKlubov = teams.length;
  let rows = teams.map(t => {
    const cona = conaZaPozicijo(t.position, steviloKlubov);
    const zoneClass = cona ? `zone-${cona.key}` : '';
    const cls = [t.isMaribor ? 'maribor-row' : '', zoneClass].filter(Boolean).join(' ');

    const prejsnja = PREJSNJA_POZICIJA[t.name];
    let gibanje = '<span class="gib gib-enako" title="Brez spremembe"></span>';
    if(prejsnja !== undefined){
      if(t.position < prejsnja) gibanje = '<span class="gib gib-gor" title="Napredovanje"></span>';
      else if(t.position > prejsnja) gibanje = '<span class="gib gib-dol" title="Nazadovanje"></span>';
      else gibanje = '<span class="gib gib-enako" title="Brez spremembe"></span>';
    }

    return `
    <tr class="${cls}">
      <td class="pos"><span class="pos-badge">${t.position}</span>${gibanje}</td>
      <td class="name-col">${t.isMaribor ? `<span class="maribor-klik" title="Prikaži kader">${t.name}</span>` : t.name}</td>
      <td>${t.played}</td>
      <td>${t.wins}</td>
      <td>${t.draws}</td>
      <td>${t.losses}</td>
      <td>${t.goalsFor}:${t.goalsAgainst}</td>
      <td>${t.diff > 0 ? '+' : ''}${t.diff}</td>
      <td class="points"><span class="points-pill">${t.points}</span></td>
    </tr>
  `;
  }).join('');

  contentEl.outerHTML = `
    <div class="lestvica-scroll-wrap" style="overflow-x:auto;">
      ${!sezonaSeZacela ? '<div class="lestvica-note" style="padding:8px 14px;text-align:left;">Sezona se še ni začela — klubi so razvrščeni po abecedi.</div>' : ''}
      <table class="lestvica" id="lestvicaContent">
        <thead>
          <tr>
            <th></th>
            <th class="name-col">Klub</th>
            <th title="Odigrane">T</th>
            <th title="Zmage">Z</th>
          <th title="Neodločeno">N</th>
          <th title="Porazi">P</th>
          <th title="Goli">D:P</th>
          <th title="Gol razlika">+/-</th>
          <th title="Točke">T</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <div class="lestvica-legend">
        <span><span class="legend-dot" style="background:var(--liga-prvakov);"></span> Liga prvakov</span>
        <span><span class="legend-dot" style="background:var(--konferencna);"></span> Konferenčna liga</span>
        <span><span class="legend-dot" style="background:var(--kvalifikacije);"></span> Kvalifikacije za obstanek</span>
        <span><span class="legend-dot" style="background:var(--derby);"></span> Izpad</span>
      </div>`;

  if(updatedEl){
    updatedEl.textContent = "";
  }
}

nalozLestvico();
